"Jesus notices a widow's offering, foretells the temple's destruction and the signs before His return, and tells them to watch and pray.",
"Judas agrees to betray Jesus. At the Last Supper He gives the bread and the cup. He prays on the Mount of Olives, is arrested, and Peter denies Him.",
"Jesus is tried before Pilate and Herod and crucified between two criminals. He prays for those crucifying Him, promises paradise to one thief, and is buried.",
"The women find the tomb empty. Jesus walks with two disciples to Emmaus, appears to the eleven, opens their minds to the Scriptures, and ascends."
],
Acts:[
"The risen Jesus teaches for forty days, promises the Holy Spirit, and ascends. The disciples wait in prayer, and Matthias is chosen to replace Judas.",
"At Pentecost the Holy Spirit comes with wind and tongues of fire, and the disciples speak in other languages. Peter preaches, about three thousand believe, and the church devotes itself to teaching and fellowship.",
"Peter and John heal a lame man at the temple gate in Jesus' name. Peter preaches to the amazed crowd and calls them to repent.",
"Peter and John are arrested and tell the council there is salvation in no other name. Released, the believers pray for boldness and share their possessions.",
"Ananias and Sapphira lie about their gift and die. The apostles are jailed and freed by an angel. Gamaliel urges caution, and they rejoice after being beaten.",
"Seven men are chosen to serve the neglected widows. Stephen, full of faith and power, is brought before the council on false charges.",
"Stephen recounts Israel's history of resisting God. Enraged, they stone him as he sees Jesus standing at God's right hand, and a young man named Saul looks on.",
"Persecution scatters the church. Philip preaches in Samaria, where Simon the sorcerer is rebuked, and then explains Isaiah to an Ethiopian official and baptizes him.",
"Saul is stopped by the risen Jesus on the Damascus road, healed through Ananias, and begins to preach. Peter heals Aeneas and raises Dorcas.",
"The centurion Cornelius and Peter each receive a vision. Peter preaches in his house, and the Holy Spirit falls on Gentiles for the first time.",
"Peter explains to the Jerusalem church why he went to Gentiles. A church grows in Antioch, where believers are first called Christians, and Barnabas brings Saul there.",
"Herod kills James and jails Peter, but an angel frees him while the church prays. Herod is struck down for accepting praise as a god.",
"The church at Antioch sends out Barnabas and Saul. On Cyprus a sorcerer is blinded and the proconsul believes. Paul preaches in Pisidian Antioch and turns to the Gentiles.",
"Paul and Barnabas preach in Iconium. In Lystra a lame man is healed and the crowd calls them gods, then stones Paul. They return home, appointing elders in each church.",
"The Jerusalem council decides that Gentile believers need not be circumcised. Paul and Barnabas part ways over John Mark.",
"Timothy joins Paul and Silas. A vision calls them to Macedonia, where Lydia believes. Jailed in Philippi, they sing at midnight, an earthquake opens the doors, and the jailer is saved.",
"A mob opposes Paul in Thessalonica. The Bereans search the Scriptures daily. In Athens Paul preaches about the unknown God on Mars Hill.",
"Paul spends eighteen months in Corinth, working with Aquila and Priscilla. In Ephesus they explain the way of God more accurately to Apollos.",
"In Ephesus Paul teaches for two years and God works unusual miracles. Believers burn their magic books, and the silversmiths start a riot over the goddess Diana.",
"Paul travels through Macedonia and Greece. At Troas Eutychus falls from a window and is revived. Paul says farewell to the Ephesian elders at Miletus.",
"Despite warnings along the way, Paul goes to Jerusalem. A mob seizes him in the temple, and Roman soldiers arrest him.",
"Paul tells the crowd how he was converted and sent to the Gentiles. The crowd erupts, and Paul's Roman citizenship spares him a scourging.",
"Before the council Paul's mention of the resurrection divides Pharisees and Sadducees. The Lord encourages him, a plot to kill him is uncovered, and he is sent to Caesarea.",
"Paul is tried before Governor Felix, who is frightened by his preaching but keeps him in custody for two years.",
"The new governor Festus hears the case, and Paul appeals to Caesar. King Agrippa and Bernice arrive and ask to hear him.",
"Paul tells King Agrippa of his conversion and calling. Agrippa says Paul almost persuades him and agrees he has done nothing deserving death.",
"Paul sails for Rome as a prisoner. A storm batters the ship for fourteen days and it wrecks, but all 276 aboard reach land as God promised.",
"On Malta Paul survives a viper's bite and heals many. He reaches Rome and for two years, under guard, freely preaches the kingdom of God."
],
Romans:[
"Paul greets the believers in Rome and says he is not ashamed of the gospel, the power of God for salvation. God's wrath is revealed against people who suppress the truth and worship created things.",
"Those who judge others while doing the same things will not escape. God shows no partiality to Jew or Gentile, and true circumcision is of the heart.",
"No one is righteous; all have sinned and fall short of God's glory. People are justified freely by His grace through faith in Christ, apart from the works of the law.",
"Abraham was counted righteous by faith before he was circumcised, so he is the father of all who believe.",
"Being justified by faith, we have peace with God. Christ died for us while we were still sinners. As sin and death came through Adam, grace and life come through Christ.",
"Should we go on sinning so grace may increase? No. Believers died to sin with Christ and are to live as servants of righteousness. The wages of sin is death, but God's gift is eternal life.",
"Believers are released from the law like a widow from marriage. The law is good but exposes sin, and Paul describes the struggle of doing what he hates.",
"There is no condemnation for those in Christ. The Spirit gives life and makes us God's children and heirs. All things work together for good, and nothing can separate us from God's love.",
"Paul grieves for unbelieving Israel. God's choice is sovereign, as with Jacob and Esau and the potter and clay. Gentiles have found righteousness by faith.",
"Israel has zeal without knowledge. Whoever confesses Jesus as Lord and believes God raised Him will be saved. Faith comes by hearing the word of God.",
"God has not rejected His people; a remnant remains. Gentiles are grafted into the olive tree and warned not to boast. Paul ends in praise of God's wisdom.",
"Present your bodies as a living sacrifice and be transformed by a renewed mind. Use your gifts in the one body, love sincerely, and overcome evil with good.",
"Be subject to governing authorities. Love fulfills the law. The day is near, so put on the Lord Jesus Christ.",
"Do not judge one another over food and special days. Each answers to the Lord, and no one should cause a brother to stumble.",
"The strong should bear with the weak, as Christ did. Paul describes his ministry to the Gentiles and his plan to visit Rome on the way to Spain.",
"Paul commends Phoebe, greets many fellow workers by name, warns about those who cause divisions, and closes with praise to God."
],
"1 Corinthians":[
"Paul appeals for unity in a church divided over leaders. The message of the cross is foolishness to the perishing but the power of God to those being saved.",
"Paul came preaching Christ crucified, not with fine words. God's wisdom is revealed by His Spirit and cannot be grasped by the natural man.",
"The Corinthians are still spiritual infants. Paul planted and Apollos watered, but God gave the increase. Christ is the foundation, and each one's work will be tested by fire.",
"Apostles are servants and stewards, treated as fools for Christ's sake. Paul writes as a father and is sending Timothy.",
"The church is tolerating a man living with his father's wife. Paul tells them to remove him and not to keep company with a so-called brother who lives immorally.",
"Believers should not take each other to court. The unrighteous will not inherit the kingdom. Flee sexual immorality, for the body is a temple of the Holy Spirit.",
"Instructions on marriage, singleness and divorce. Each person should remain in the situation in which God called him.",
"On food offered to idols: knowledge puffs up but love builds up. Do not let your freedom cause a weaker brother to stumble.",
"Paul has the rights of an apostle but does not use them, becoming all things to all people to win some. Run so as to win the prize.",
"Israel's failures in the wilderness are warnings. God is faithful and provides a way of escape from temptation. Flee idolatry, and do everything to the glory of God.",
"Instructions on head coverings and a rebuke for abuses at the Lord's Supper. Paul repeats Jesus' words over the bread and cup and calls for self-examination.",
"There are many spiritual gifts but one Spirit. The church is one body with many members, each needed.",
"Without love, gifts and sacrifice are nothing. Love is patient and kind and never fails. Faith, hope and love remain, and the greatest is love.",
"Prophecy is to be preferred to tongues because it builds up the church. Everything in worship should be done decently and in order.",
"The gospel: Christ died for our sins, was buried, and rose the third day. If He is not risen, faith is empty. The dead will be raised imperishable, and death is swallowed up in victory.",
"Instructions for the collection for the saints, Paul's travel plans, and a closing charge to stand firm in the faith and do everything in love."
],
"2 Corinthians":[
"God is the Father of mercies who comforts us so that we can comfort others. Paul tells of his trouble in Asia and explains his change of plans.",
"Paul urges them to forgive and restore a repentant offender. God leads His servants in triumph and spreads the fragrance of Christ through them.",
"The Corinthians themselves are Paul's letter of recommendation. The new covenant of the Spirit gives life and surpasses the old in glory.",
"We have this treasure in earthen vessels, so the power is seen to be God's. Hard pressed but not crushed, Paul looks to an eternal weight of glory.",
"We walk by faith, not by sight, and must all appear before Christ's judgment seat. Anyone in Christ is a new creation, and God has given us the ministry of reconciliation.",
"Now is the day of salvation. Paul lists the hardships that mark his ministry and warns against being unequally yoked with unbelievers.",
"Paul rejoices at Titus's report. Their godly sorrow produced repentance, not regret.",
"The churches of Macedonia gave generously out of poverty. Christ became poor so that we might become rich. Titus is sent to complete the collection.",
"Whoever sows bountifully will reap bountifully. God loves a cheerful giver and supplies what is needed for every good work.",
"Paul defends his authority against critics. His weapons are not of the flesh but mighty in God, and the one who boasts should boast in the Lord.",
"Paul fears they are being led astray by false apostles. He reluctantly lists his sufferings: beatings, shipwrecks, dangers, and care for all the churches.",
"Paul tells of being caught up to the third heaven and of a thorn in the flesh. The Lord told him His grace is sufficient, for strength is made perfect in weakness.",
"Before his third visit Paul tells them to examine themselves to see whether they are in the faith. He closes with a blessing."
],
Galatians:[
"Paul is astonished that the Galatians are turning to a different gospel. His gospel came by revelation of Jesus Christ, not from men, and he recounts his conversion.",
"The Jerusalem leaders accepted Paul's ministry to the Gentiles. He confronted Peter at Antioch, since a person is justified by faith in Christ and not by works of the law.",
"The Galatians received the Spirit by faith, like Abraham. Christ redeemed us from the curse of the law, which was a tutor to bring us to Him. All are one in Christ.",
"Believers are no longer slaves but sons and heirs. Paul pleads with them and contrasts Hagar and Sarah as two covenants.",
"Stand fast in the liberty Christ gives. Walk in the Spirit and you will not fulfill the desires of the flesh, whose works are contrasted with the fruit of the Spirit.",
"Restore the fallen gently and bear one another's burdens. A man reaps what he sows. Paul boasts only in the cross of Christ."
],
Ephesians:[
"Praise for every spiritual blessing in Christ: chosen, adopted, redeemed and sealed with the Spirit. Paul prays they will know God's power, which raised Christ above all.",
"Once dead in sins, believers have been made alive by grace through faith, not by works. Christ has made Jew and Gentile one, breaking down the wall between them.",
"The mystery now revealed is that Gentiles are fellow heirs. Paul prays they will be rooted in love and know the love of Christ.",
"Walk worthy of your calling in unity. Christ gave leaders to equip the saints. Put off the old man, put on the new, and do not grieve the Holy Spirit.",
"Be imitators of God and walk in love, light and wisdom. Be filled with the Spirit. Marriage pictures Christ and the church.",
"Instructions to children and parents, servants and masters. Put on the whole armor of God to stand against the devil."
],
Philippians:[
"Paul thanks God for the Philippians and says his imprisonment has advanced the gospel. For him, to live is Christ and to die is gain.",
"Have the mind of Christ, who humbled Himself to death on a cross and was highly exalted. Work out your salvation and shine as lights. Timothy and Epaphroditus are commended.",
"Paul counts all his former gains as loss for the sake of knowing Christ. He presses toward the goal, and our citizenship is in heaven.",
"Rejoice in the Lord always. Be anxious for nothing but pray, and think on what is true and lovely. Paul has learned contentment, and God will supply every need."
],
Colossians:[
"Paul gives thanks and prays for the Colossians. Christ is the image of the invisible God, creator of all things and head of the church, who reconciled us by His cross.",
"All the fullness of God dwells in Christ, and believers are complete in Him. Do not be taken captive by philosophy, legalism or the worship of angels.",
"Set your mind on things above. Put to death the old ways and put on love. Let the word of Christ dwell in you richly. Instructions for households.",
"Continue in prayer and let your speech be gracious. Paul sends greetings from his companions, including Tychicus, Onesimus and Luke."
],
"1 Thessalonians":[
"Paul thanks God for the Thessalonians' faith, love and hope. They turned from idols to serve the living God and wait for His Son.",
"Paul recalls his gentle and blameless ministry among them and how they received the message as the word of God.",
"Timothy brings good news of their faith. Paul prays that their love will increase and that they will be blameless at the Lord's coming.",
"Live to please God, avoid sexual immorality, and work quietly. The Lord will descend, the dead in Christ will rise first, and believers will be caught up to meet Him.",
"The day of the Lord will come like a thief in the night. Be watchful and sober. Rejoice always, pray without ceasing, and give thanks in everything."
],
"2 Thessalonians":[
"Paul thanks God for their growing faith under persecution. God will repay those who trouble them when the Lord Jesus is revealed from heaven.",
"That day will not come until the falling away comes first and the man of sin is revealed. Stand fast and hold to what you were taught.",
"Paul asks for prayer and warns against idleness: if anyone will not work, neither should he eat."
],
"1 Timothy":[
"Paul charges Timothy to stop false teachers in Ephesus. Paul himself, once a blasphemer, received mercy as the chief of sinners.",
"Prayers are to be made for all people, including kings. There is one God and one Mediator, the Man Christ Jesus. Instructions follow for men and women in worship.",
"The qualifications for bishops and deacons, and a statement of the mystery of godliness.",
"Some will depart from the faith in later times. Timothy is to be a good minister, an example despite his youth, and to train himself in godliness.",
"How to treat older and younger members, which widows the church should support, and honoring and correcting elders.",
"Godliness with contentment is great gain, and the love of money is a root of all kinds of evil. Fight the good fight of faith. The rich are told to be generous."
],
"2 Timothy":[
"Paul reminds Timothy of his sincere faith and urges him to stir up God's gift. God has not given a spirit of fear. Do not be ashamed of the gospel.",
"Be strong in grace and endure hardship like a soldier, an athlete and a farmer. Be a worker who handles the word of truth rightly, and flee youthful lusts.",
"Perilous times will come in the last days. Timothy is to continue in the Scriptures, all of which are inspired by God and profitable.",
"Preach the word in season and out. Paul says he has fought the good fight and finished the race, and asks Timothy to come soon."
],
Titus:[
"Paul left Titus in Crete to appoint elders and gives their qualifications. False teachers must be rebuked.",
"Sound teaching for older and younger men and women and for servants. The grace of God that brings salvation teaches us to live godly lives while we wait for the blessed hope.",
"Be subject to rulers and gentle to all. God saved us not by works of righteousness but by His mercy. Avoid foolish disputes."
],
Philemon:[
"Paul appeals to Philemon for Onesimus, a runaway servant who has become a believer, asking him to receive him back as a beloved brother and to charge any debt to Paul."
],
Hebrews:[
"God, who spoke through the prophets, has now spoken by His Son, the heir of all things and the brightness of His glory, who is far greater than the angels.",
"Do not neglect so great a salvation. Jesus was made a little lower than the angels to taste death for everyone and became a merciful and faithful high priest.",
"Jesus is worthy of more glory than Moses. Do not harden your hearts as Israel did in the wilderness.",
"A rest remains for the people of God. The word of God is living and powerful. We have a great high priest, so we may come boldly to the throne of grace.",
"A high priest is appointed by God. Christ is a priest forever after the order of Melchizedek. The readers are rebuked for still needing milk.",
"Go on to maturity. A warning about falling away is followed by assurance: God's promise and oath are an anchor of the soul.",
"Melchizedek, king of Salem, was greater than Abraham and the Levitical priests. Jesus holds an unchangeable priesthood and is able to save to the uttermost.",
"Christ is the high priest of a better covenant, the new covenant in which God writes His laws on the heart.",
"The earthly tabernacle and its sacrifices were a copy. Christ entered heaven once for all with His own blood, since without the shedding of blood there is no forgiveness.",
"Animal sacrifices could never take away sins, but Christ offered one sacrifice forever. Draw near, hold fast, and do not forsake meeting together. A warning against willful sin.",
"Faith is the substance of things hoped for. The chapter recalls the faith of Abel, Enoch, Noah, Abraham, Sarah, Moses, Rahab and many others.",
"Run the race with endurance, looking to Jesus. God disciplines those He loves as sons. Believers have come to Mount Zion and a kingdom that cannot be shaken.",
"Closing instructions on love, hospitality, marriage and contentment. Jesus Christ is the same yesterday, today and forever. Offer the sacrifice of praise."
],
James:[
"Count trials as joy, since testing produces patience. Ask God for wisdom in faith. Temptation comes from our own desires, and we are to be doers of the word, not hearers only.",
"Do not show favoritism to the rich. Faith without works is dead, as the examples of Abraham and Rahab show.",
"Teachers are judged more strictly. The tongue is small but hard to tame. Wisdom from above is pure and peaceable.",
"Quarrels come from selfish desires, and friendship with the world is enmity with God. Submit to God and resist the devil. Do not boast about tomorrow.",
"A warning to the rich who oppress. Be patient like Job until the Lord comes. The prayer of faith will save the sick, and the prayer of a righteous man avails much."
],
"1 Peter":[
"Believers are born again to a living hope through Christ's resurrection. Their faith is tested like gold. Be holy, for you were redeemed with the precious blood of Christ.",
"Believers are living stones, a chosen generation and a royal priesthood. Submit to authorities, and follow Christ, who bore our sins in His own body on the tree.",
"Instructions to wives and husbands. Be of one mind, and always be ready to give a reason for your hope. Christ suffered once for sins, the just for the unjust.",
"Live for the will of God. Love one another fervently and serve with your gifts. Do not be surprised at fiery trials; rejoice to share Christ's sufferings.",
"Elders are to shepherd God's flock willingly. Humble yourselves and cast your cares on Him. Be vigilant, for the devil prowls like a roaring lion."
],
"2 Peter":[
"God's power has given all things for life and godliness. Add virtue, knowledge and love to your faith. Peter was an eyewitness of Christ's majesty, and prophecy came by the Holy Spirit.",
"False teachers will arise and bring destruction on themselves. God judged the angels who sinned, the ancient world and Sodom, and knows how to rescue the godly.",
"Scoffers will question the Lord's coming, but He is patient, not willing that any perish. The day of the Lord will come like a thief, and there will be new heavens and a new earth."
],
"1 John":[
"John writes about the Word of life he saw and touched. God is light. If we walk in the light we have fellowship, and if we confess our sins He forgives us.",
"Jesus Christ is our Advocate with the Father. Whoever knows Him keeps His commandments. Do not love the world, and beware of antichrists who deny the Son.",
"Behold what love the Father has given, that we are called children of God. Love one another in deed and truth, as Christ laid down His life for us.",
"Test the spirits. He who is in you is greater than he who is in the world. God is love, and perfect love casts out fear.",
"Faith is the victory that overcomes the world. Whoever has the Son has life. John writes so that believers may know they have eternal life."
],
"2 John":[
"The elder writes to the elect lady and her children to walk in truth and love, and warns them not to welcome deceivers who deny that Jesus Christ came in the flesh."
],
"3 John":[
"The elder commends Gaius for walking in truth and showing hospitality to traveling teachers, rebukes Diotrephes who loves to be first, and speaks well of Demetrius."
],
Jude:[
"Jude urges believers to contend for the faith against ungodly men who have crept in. He recalls past judgments, tells them to keep themselves in God's love, and ends with a doxology."
],
Revelation:[
"John, on the island of Patmos, receives the revelation of Jesus Christ. He sees the glorified Son of Man standing among seven golden lampstands.",
"Letters to four churches: Ephesus has left its first love, Smyrna is told to be faithful unto death, and Pergamos and Thyatira are warned about false teaching.",
"Letters to three more churches: Sardis is called dead, Philadelphia has an open door, and lukewarm Laodicea is told that Christ stands at the door and knocks.",
"John sees a throne in heaven surrounded by twenty-four elders and four living creatures who never stop saying holy, holy, holy.",
"No one is worthy to open the scroll with seven seals except the Lion of the tribe of Judah, who appears as a Lamb that was slain. All heaven sings His praise.",
"The Lamb opens six seals: four horsemen bring conquest, war, famine and death; the martyrs cry out; and the sky and earth are shaken.",
"God's servants are sealed, 144,000 from the tribes of Israel. A great multitude from every nation stands before the throne in white robes.",
"The seventh seal brings silence in heaven. Four trumpets sound, striking the earth, the sea, the rivers and the heavens.",
"The fifth and sixth trumpets release locusts from the bottomless pit and a vast army. The survivors still do not repent.",
"A mighty angel holds a little book. John eats it, and it is sweet in his mouth but bitter in his stomach.",
"Two witnesses prophesy for 1,260 days, are killed, and rise again. The seventh trumpet announces that the kingdoms of this world have become the Lord's.",
"A woman gives birth to a male child whom a great red dragon seeks to devour. Michael casts the dragon, Satan, out of heaven, and he persecutes the woman's offspring.",
"A beast rises from the sea and is given authority, and a second beast from the earth makes people worship it and take its mark, whose number is 666.",
"The Lamb stands on Mount Zion with the 144,000. Three angels proclaim their messages, and the earth is harvested.",
"Seven angels prepare the seven last plagues, while those who overcame the beast sing the song of Moses and of the Lamb.",
"The seven bowls of God's wrath are poured out on the earth. The kings gather at Armageddon, and a great earthquake strikes.",
"John sees a great harlot, Babylon, sitting on a scarlet beast. The kings allied with the beast make war on the Lamb, and the Lamb overcomes them.",
"Babylon the great is fallen. Kings and merchants mourn her sudden ruin, and God's people are called to come out of her.",
"Heaven rejoices at the marriage supper of the Lamb. Christ rides out on a white horse as King of kings, and the beast and false prophet are thrown into the lake of fire.",
"Satan is bound for a thousand years while the saints reign with Christ. Released, he is finally defeated. The dead are judged before the great white throne.",
"John sees a new heaven and a new earth and the New Jerusalem coming down. God dwells with His people and wipes away every tear.",
"The river of life flows from the throne, with the tree of life beside it. Jesus says He is coming quickly, and the book ends with a warning and an invitation to come."
]

people:[
{n:"Adam",t:"The first man, formed by God from dust and placed in Eden. God gave him dominion over creation and the first marriage. His disobedience brought sin and death into the world, setting the stage for the promised Redeemer."},
{n:"Noah",t:"A righteous man who walked with God in a violent age. God used him to build the ark and preserve his family and the animals through the flood, then made the rainbow covenant with him."},
{n:"Abraham",t:"Called out of Ur to a land God would show him. God made a covenant to give him descendants, the land, and blessing for all nations. He believed God, became father of Isaac, and passed the test on Moriah."},
{n:"Sarah",t:"Abraham's wife, barren until old age. God gave her Isaac at ninety, making her the mother of the promised line and an example of faith in God's promise."},
{n:"Isaac",t:"The promised son of Abraham and Sarah, offered on Moriah and spared. God confirmed the covenant to him, and through him and Rebekah came Jacob and Esau."},
{n:"Jacob (Israel)",t:"Younger twin who gained the birthright and blessing, met God at Bethel and wrestled at Peniel, where he was renamed Israel. His twelve sons became the twelve tribes."},
{n:"Joseph",t:"Jacob's favored son, sold into slavery by his brothers. God raised him from prison to rule Egypt under Pharaoh, and used him to save many lives, including his own family, through the famine."},
{n:"Moses",t:"Rescued from the Nile and raised in Pharaoh's house. God called him at the burning bush to lead Israel out of Egypt, part the Red Sea, receive the Law at Sinai, and guide the people forty years in the wilderness."},
{n:"Aaron",t:"Moses' older brother and spokesman before Pharaoh. God made him Israel's first high priest, and the priesthood continued through his sons."},
{n:"Joshua",t:"Moses' assistant and one of two faithful spies. God used him to lead Israel across the Jordan, bring down Jericho, conquer Canaan, and divide the land among the tribes."},
{n:"Deborah",t:"A prophetess and judge of Israel. God used her to summon Barak and deliver Israel from Sisera and the Canaanite army, bringing forty years of rest."},
{n:"Gideon",t:"A fearful man threshing wheat in hiding whom God called a mighty man of valor. With only 300 men, trumpets and torches, God defeated the Midianites through him."},
{n:"Samson",t:"A Nazirite judge given great strength by the Spirit of the Lord. God used him to begin delivering Israel from the Philistines, most of all in his death when he pulled down their temple."},
{n:"Ruth",t:"A Moabite widow who stayed loyal to Naomi and to Naomi's God. She married Boaz, her kinsman redeemer, and became the great-grandmother of King David."},
{n:"Samuel",t:"Given to Hannah in answer to prayer and raised at the tabernacle. God used him as prophet, priest and the last judge, and he anointed both Saul and David as kings."},
{n:"Saul",t:"Israel's first king, from the tribe of Benjamin. He won early victories but disobeyed God's commands, and the kingdom was taken from him and given to David."},
{n:"David",t:"A shepherd from Bethlehem who killed Goliath and became Israel's greatest king. A man after God's own heart, he wrote many psalms, made Jerusalem the capital, and received God's promise of an everlasting throne."},
{n:"Solomon",t:"David's son, who asked God for wisdom. God gave him wisdom, wealth and peace, and used him to build the temple in Jerusalem. His later idolatry led to the kingdom dividing."},
{n:"Elijah",t:"A prophet to the northern kingdom in Ahab's day. God used him to shut the heavens, raise a widow's son, call down fire on Mount Carmel against the prophets of Baal, and took him to heaven in a whirlwind."},
{n:"Elisha",t:"Elijah's successor, who received a double portion of his spirit. Through him God multiplied a widow's oil, raised the Shunammite's son, and healed Naaman of leprosy."},
{n:"Hezekiah",t:"A king of Judah who trusted the Lord and removed idols. God delivered Jerusalem from the Assyrian army in his reign and added fifteen years to his life when he prayed."},
{n:"Isaiah",t:"A prophet to Judah who saw the Lord high and lifted up and answered His call. God used him to warn of judgment and to foretell the virgin birth and the suffering Servant."},
{n:"Jeremiah",t:"Called before birth as a prophet to the nations. He warned Judah for decades of the coming Babylonian captivity, suffered for it, and announced the new covenant written on the heart."},
{n:"Daniel",t:"Taken to Babylon as a youth, he stayed faithful to God in a pagan court. God gave him wisdom to interpret dreams, protected him in the lions' den, and showed him visions of future kingdoms."},
{n:"Esther",t:"A Jewish orphan who became queen of Persia. God used her courage in approaching the king to expose Haman's plot and save her people from destruction."},
{n:"Nehemiah",t:"Cupbearer to the Persian king. God used him to return to Jerusalem and lead the rebuilding of its walls in fifty-two days despite opposition, and to help restore the people's obedience."},
{n:"Job",t:"A blameless man who lost his wealth, children and health yet did not curse God. Through his suffering God showed that faith can hold without answers, and afterward restored him twice over."},
{n:"Jonah",t:"A prophet who ran from God's call and was swallowed by a great fish. God used his reluctant preaching to bring Nineveh to repentance and taught him about divine mercy."},
{n:"Mary, mother of Jesus",t:"A young virgin from Nazareth who found favor with God. She submitted to His word and bore Jesus, the Son of God, and was present at the cross and with the early believers."},
{n:"John the Baptist",t:"The forerunner promised by the prophets. He preached repentance in the wilderness, baptized Jesus in the Jordan, and pointed people to Him as the Lamb of God."},
{n:"Peter",t:"A fisherman called to follow Jesus and a leader among the twelve. He confessed Jesus as the Christ, denied Him and was restored, preached at Pentecost where about three thousand believed, and first took the gospel to Gentiles."},
{n:"John the apostle",t:"A fisherman, son of Zebedee, and the disciple whom Jesus loved. God used him to write a Gospel, three letters and the Revelation received on Patmos."},
{n:"Stephen",t:"One of seven chosen to serve the Jerusalem church, full of faith and the Holy Spirit. He became the first Christian martyr, and his death scattered believers who carried the gospel outward."},
{n:"Paul",t:"Once Saul the persecutor, converted by the risen Christ on the Damascus road. God used him as apostle to the Gentiles, planting churches on missionary journeys and writing much of the New Testament."},
{n:"Barnabas",t:"A generous Levite from Cyprus known as an encourager. He vouched for the newly converted Saul, served the church at Antioch, and went with Paul on the first missionary journey."},
{n:"Timothy",t:"A young believer from Lystra taught the Scriptures by his mother and grandmother. He became Paul's trusted co-worker, led the church at Ephesus, and received two of Paul's letters."},
{n:"Eve",t:"The first woman, made from Adam's rib as his companion. She was deceived by the serpent, yet God promised that her Seed would bruise the serpent's head. She is called the mother of all living."},
{n:"Enoch",t:"A descendant of Seth who walked with God for three hundred years. God took him so that he did not see death, making him an example of a life that pleased God."},
{n:"Lot",t:"Abraham's nephew, who chose the plain near Sodom. God sent angels to bring him out before the city was destroyed, showing that He knows how to rescue the righteous."},
{n:"Rebekah",t:"Chosen at a well in answer to a servant's prayer, she left home in faith to marry Isaac. God told her that two nations were in her womb, and she became mother of Jacob and Esau."},
{n:"Miriam",t:"The sister of Moses and Aaron who watched over him in the Nile. A prophetess, she led the women of Israel in song after the Red Sea crossing."},
{n:"Caleb",t:"One of the twelve spies, who followed the Lord fully and urged Israel to take the land. Forty-five years later, at eighty-five, he claimed the hill country of Hebron and drove out the giants."},
{n:"Rahab",t:"A woman of Jericho who hid Israel's spies because she believed in their God. She and her household were spared by the scarlet cord, and she became an ancestor of David and of Jesus."},
{n:"Hannah",t:"A barren woman who poured out her soul to the Lord at Shiloh. God gave her Samuel, whom she gave back to His service, and her prayer of praise is recorded in Scripture."},
{n:"Jonathan",t:"King Saul's son and a courageous warrior. He trusted God in battle, loved David as his own soul, and protected him even though it cost him the throne."},
{n:"Nathan",t:"A prophet in David's court. God used him to deliver the promise of an everlasting house to David and to confront the king about his sin with Bathsheba."},
{n:"Josiah",t:"Made king of Judah at eight years old. When the Book of the Law was found in the temple he humbled himself, tore down idols, and led the nation in renewing the covenant and keeping the Passover."},
{n:"Ezra",t:"A priest and scribe skilled in the Law of Moses. God used him to lead a group of exiles back to Jerusalem and to teach the people God's word, bringing repentance."},
{n:"Ezekiel",t:"A priest taken captive to Babylon and called as a prophet by the river Chebar. God gave him visions of His glory, the valley of dry bones, and a restored temple."},
{n:"Mordecai",t:"A Jew in the Persian capital who raised his cousin Esther. He refused to bow to Haman, urged Esther to act, and was raised to second in the kingdom."},
{n:"Shadrach, Meshach and Abed-Nego",t:"Three young Jewish men in Babylon who refused to bow to Nebuchadnezzar's gold image. God delivered them unharmed from the fiery furnace, and the king praised their God."},
{n:"Joseph, husband of Mary",t:"A just man and carpenter of David's line. He obeyed God's messages in dreams, took Mary as his wife, named the child Jesus, and protected the family by fleeing to Egypt."},
{n:"Mary Magdalene",t:"A woman from whom Jesus cast out seven demons. She followed and supported Him, stood near the cross, and was the first to see the risen Lord and tell the disciples."},
{n:"Andrew",t:"A fisherman and one of the first to follow Jesus. He brought his brother Simon Peter to Him and later brought the boy with five loaves and two fish."},
{n:"Matthew",t:"A tax collector, also called Levi, who left his booth when Jesus called him. He became one of the twelve and wrote the Gospel that bears his name."},
{n:"Thomas",t:"One of the twelve, remembered for doubting the resurrection until he saw Jesus' wounds. He then confessed Him as his Lord and his God."},
{n:"Nicodemus",t:"A Pharisee and ruler of the Jews who came to Jesus by night and heard that he must be born again. He later spoke up for Jesus and helped bury Him."},
{n:"Martha, Mary and Lazarus",t:"A family in Bethany whom Jesus loved. Mary sat at His feet and later anointed Him, Martha confessed Him as the Christ, and Lazarus was raised from the dead after four days."},
{n:"James, brother of Jesus",t:"He did not believe during Jesus' ministry but saw the risen Lord. He became a leader of the Jerusalem church, guided the council on Gentile believers, and wrote the letter of James."},
{n:"Philip the evangelist",t:"One of the seven chosen to serve in Jerusalem. He preached Christ in Samaria and explained Isaiah to the Ethiopian official on the desert road, then baptized him."},
{n:"Cornelius",t:"A Roman centurion in Caesarea who feared God and prayed. God sent Peter to him, and he and his household became the first Gentiles to receive the Holy Spirit."},
{n:"Luke",t:"A physician and Paul's companion on his travels. He carefully investigated the accounts and wrote the Gospel of Luke and the book of Acts."},
{n:"Silas",t:"A leader in the Jerusalem church who joined Paul on the second missionary journey. He sang hymns with Paul in the Philippian jail the night the jailer believed."},
{n:"Priscilla and Aquila",t:"A married couple and tentmakers who worked with Paul in Corinth and Ephesus. They hosted a church in their home and explained the way of God more accurately to Apollos."},
{n:"Lydia",t:"A seller of purple cloth in Philippi. The Lord opened her heart to Paul's message, she and her household were baptized, and her home became a base for the church there."},
{n:"Naomi",t:"A widow from Bethlehem who lost her husband and both sons in Moab and came home bitter. Through her daughter-in-law Ruth and the kinsman Boaz, God restored her family and gave her a grandson in David's line."},
{n:"Boaz",t:"A wealthy and godly landowner of Bethlehem. He showed kindness to Ruth, redeemed Elimelech's land as kinsman redeemer, and married her, becoming the great-grandfather of David."},
{n:"Jephthah",t:"A warrior from Gilead rejected by his brothers. The Spirit of the Lord came on him and he delivered Israel from the Ammonites, though he is also remembered for a rash vow."},
{n:"Eli",t:"The priest at Shiloh who judged Israel forty years and raised the boy Samuel. He failed to restrain his wicked sons, and God judged his house."},
{n:"Abigail",t:"The wise wife of the foolish Nabal. Her quick action and humble words kept David from shedding blood in anger, and after Nabal's death she became David's wife."},
{n:"Bathsheba",t:"The wife of Uriah, taken by King David. She later became his wife, the mother of Solomon, and helped secure Solomon's place on the throne."},
{n:"Absalom",t:"David's handsome son who killed his brother Amnon and later stole the hearts of Israel to seize the throne. His revolt ended with his death in the woods of Ephraim."},
{n:"Joab",t:"David's nephew and commander of his army. A skilled but ruthless general, he won David's wars and captured Jerusalem's stronghold, yet murdered Abner and Amasa and killed Absalom against orders."},
{n:"Mephibosheth",t:"Jonathan's son, lame in both feet from childhood. David sought him out for Jonathan's sake, restored Saul's land to him, and gave him a seat at the king's table."},
{n:"Rehoboam",t:"Solomon's son and successor. His harsh answer to the people split the kingdom, leaving him only Judah and Benjamin."},
{n:"Jeroboam",t:"An official of Solomon to whom God gave ten tribes. As first king of the northern kingdom he set up golden calves at Bethel and Dan, leading Israel into lasting sin."},
{n:"Ahab and Jezebel",t:"Ahab was a king of Israel who did more evil than all before him, and Jezebel his wife promoted Baal worship and killed the Lord's prophets. God sent Elijah to confront them, and both died as he foretold."},
{n:"Naaman",t:"Commander of the Syrian army and a leper. At the word of a captive Israelite girl he went to Elisha, washed seven times in the Jordan, was healed, and confessed the God of Israel."},
{n:"Jehu",t:"An army commander anointed king of Israel at Elisha's direction. God used him to end the house of Ahab and wipe out Baal worship, though he kept the golden calves."},
{n:"Jehoshaphat",t:"A king of Judah who sought the Lord and sent teachers of the law through the land. When a great army came against him he prayed, and God gave victory as the singers praised."},
{n:"Manasseh",t:"Hezekiah's son and Judah's longest-reigning king, who filled the land with idolatry and bloodshed. Taken captive, he humbled himself, and God restored him to Jerusalem."},
{n:"Asa",t:"A king of Judah who removed idols and called the nation to seek the Lord. God gave him victory over a vast Ethiopian army when he prayed, though late in life he relied on Syria and on physicians alone."},
{n:"Joash",t:"Hidden in the temple as an infant and crowned at seven. Guided by the priest Jehoiada he repaired the house of the Lord, but after Jehoiada died he turned to idols."},
{n:"Uzziah",t:"Became king of Judah at sixteen and reigned fifty-two years. God made him prosper while he sought the Lord, but in pride he entered the temple to burn incense and was struck with leprosy."},
{n:"Zerubbabel",t:"A descendant of David and governor of Judah. God used him to lead the first exiles home from Babylon and to rebuild the temple, encouraged by the prophets Haggai and Zechariah."},
{n:"Haman",t:"A high official of Persia who plotted to destroy all the Jews because Mordecai would not bow to him. God overturned his plan through Esther, and he was hanged on his own gallows."},
{n:"Baruch",t:"Jeremiah's faithful scribe. He wrote down the prophet's words, read them publicly in the temple at great risk, and rewrote the scroll after King Jehoiakim burned it."},
{n:"Zedekiah",t:"The last king of Judah, placed on the throne by Nebuchadnezzar. He asked Jeremiah for God's word but would not obey it, and saw Jerusalem fall before being blinded and taken to Babylon."},
{n:"Nebuchadnezzar",t:"King of Babylon, whom God used to judge Judah, destroy Jerusalem and carry the people into exile. Humbled by God for his pride, he came to praise the King of heaven."},
{n:"Belshazzar",t:"A ruler of Babylon who drank from the temple vessels at a great feast. God wrote his judgment on the wall, Daniel read it, and that night the kingdom fell to the Medes and Persians."},
{n:"Hosea",t:"A prophet to the northern kingdom in its last decades. God told him to marry an unfaithful wife and take her back, making his own marriage a picture of God's faithful love for Israel."},
{n:"Amos",t:"A shepherd and tender of sycamore fruit from Tekoa in Judah. God sent him north to Israel to denounce injustice toward the poor and empty worship."},
{n:"Micah",t:"A prophet from the small town of Moresheth in Judah. He condemned corrupt leaders, foretold that a ruler would come from Bethlehem, and summed up what the Lord requires."},
{n:"Habakkuk",t:"A prophet who questioned God about evil and about using Babylon to judge Judah. God answered that the just shall live by faith, and Habakkuk ended in a song of trust."},
{n:"Haggai and Zechariah",t:"Two prophets to the Jews who returned from exile. Their preaching stirred Zerubbabel and the people to finish rebuilding the temple, and Zechariah foretold the coming King."},
{n:"Malachi",t:"The last of the Old Testament prophets. He rebuked half-hearted priests and people after the exile and foretold a messenger who would prepare the way of the Lord."},
{n:"Zacharias and Elizabeth",t:"A righteous priest and his wife, childless and old. Gabriel announced that they would have a son, and Elizabeth bore John the Baptist, who prepared the way for the Lord."},
{n:"Herod the Great",t:"The king of Judea when Jesus was born. Troubled by news of a newborn king, he ordered the boys of Bethlehem killed, but God sent Joseph, Mary and the child safely to Egypt."},
{n:"James, son of Zebedee",t:"A fisherman and brother of John, one of the three closest to Jesus who saw the transfiguration. He was the first of the apostles to be martyred, killed by Herod with the sword."},
{n:"Zacchaeus",t:"A wealthy chief tax collector in Jericho who climbed a sycamore tree to see Jesus. Jesus came to his house, and he repaid those he had cheated fourfold and gave half his goods to the poor."},
{n:"Judas Iscariot",t:"One of the twelve, who kept the money box. He betrayed Jesus to the chief priests for thirty pieces of silver, then was filled with remorse and hanged himself."},
{n:"Pontius Pilate",t:"The Roman governor of Judea. He found no fault in Jesus, yet gave in to the crowd, released Barabbas, and handed Jesus over to be crucified."},
{n:"Ananias of Damascus",t:"A disciple the Lord sent to Saul after his encounter on the road. Though afraid, he obeyed, laid hands on Saul so that he received his sight, and baptized him."},
{n:"Apollos",t:"An eloquent Jew from Alexandria, mighty in the Scriptures. After Priscilla and Aquila taught him more fully, he powerfully showed from Scripture that Jesus is the Christ and strengthened the church at Corinth."},
{n:"Melchizedek",t:"King of Salem and priest of God Most High, who blessed Abraham and received a tenth from him. Scripture uses him as the pattern for Christ's eternal priesthood."},
{n:"Simeon and Anna",t:"Two aged, devout people waiting in the temple for God's promise. When Mary and Joseph brought the infant Jesus, Simeon blessed God for His salvation and Anna spoke of Him to all who looked for redemption."},
{n:"Philip the apostle",t:"One of the twelve, from Bethsaida. He brought Nathanael to Jesus, was tested at the feeding of the five thousand, and brought Greeks who wanted to see Jesus."},
{n:"Herod Antipas",t:"Ruler of Galilee during Jesus' ministry. He imprisoned and beheaded John the Baptist and later mocked Jesus when Pilate sent Him to him during His trial."},
{n:"Caiaphas",t:"The high priest who presided over the council that condemned Jesus. He said it was better for one man to die for the people, unknowingly prophesying the meaning of Jesus' death."},
{n:"John Mark",t:"A young man from Jerusalem whose mother's house hosted the church. He left Paul and Barnabas on their first journey but later proved useful to Paul, and wrote the Gospel of Mark."},
{n:"Titus",t:"A Gentile believer and trusted co-worker of Paul. He carried Paul's letters to Corinth, helped with the collection for the saints, and was left in Crete to set the churches in order."},
{n:"Philemon and Onesimus",t:"Philemon was a believer in Colosse whose servant Onesimus ran away. Onesimus came to faith through Paul in prison, and Paul sent him back asking Philemon to receive him as a brother."},
{n:"Jude",t:"A brother of James and of Jesus who did not believe until after the resurrection. He wrote the short letter urging believers to contend for the faith."}

verses:[
{r:"Genesis 1:1-2",t:"In the beginning God created the heaven and the earth. And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters."},
{r:"Genesis 1:26",t:"And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth."},
{r:"Genesis 2:1-4",t:"Thus the heavens and the earth were finished, and all the host of them. And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made. And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made. These are the generations of the heavens and of the earth when they were created, in the day that the LORD God made the earth and the heavens,"},
{r:"Genesis 2:24",t:"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."},
{r:"Genesis 3:15",t:"And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel."},
{r:"Exodus 14:14",t:"The LORD shall fight for you, and ye shall hold your peace."},
{r:"Exodus 20:1-17",t:"And God spake all these words, saying, I am the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage. Thou shalt have no other gods before me. Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: Thou shalt not bow down thyself to them, nor serve them: for I the LORD thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; And shewing mercy unto thousands of them that love me, and keep my commandments. Thou shalt not take the name of the LORD thy God in vain; for the LORD will not hold him guiltless that taketh his name in vain. Remember the sabbath day, to keep it holy. Six days shalt thou labour, and do all thy work: But the seventh day is the sabbath of the LORD thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates: For in six days the LORD made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the LORD blessed the sabbath day, and hallowed it. Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth thee. Thou shalt not kill. Thou shalt not commit adultery. Thou shalt not steal. Thou shalt not bear false witness against thy neighbour. Thou shalt not covet thy neighbour's house, thou shalt not covet thy neighbour's wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that is thy neighbour's."},
{r:"Leviticus 19:2",t:"Speak unto all the congregation of the children of Israel, and say unto them, Ye shall be holy: for I the LORD your God am holy."},
{r:"Deuteronomy 6:4-7",t:"Hear, O Israel: The LORD our God is one LORD: And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might. And these words, which I command thee this day, shall be in thine heart: And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up."},
{r:"Joshua 1:7-9",t:"Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left, that thou mayest prosper whithersoever thou goest. This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success. Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."},
{r:"Ruth 1:16",t:"And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:"},
{r:"Psalm 1:1-6",t:"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful. But his delight is in the law of the LORD; and in his law doth he meditate day and night. And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper. The ungodly are not so: but are like the chaff which the wind driveth away. Therefore the ungodly shall not stand in the judgment, nor sinners in the congregation of the righteous. For the LORD knoweth the way of the righteous: but the way of the ungodly shall perish."},
{r:"Psalm 19:14",t:"Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer."},
{r:"Psalm 23:1-6",t:"The LORD is my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters. He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake. Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me. Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over. Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever."},
{r:"Psalm 46:10",t:"Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth."},
{r:"Psalm 100:2",t:"Serve the LORD with gladness: come before his presence with singing."},
{r:"Psalm 119:11",t:"Thy word have I hid in mine heart, that I might not sin against thee."},
{r:"Proverbs 3:5-6",t:"Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."},
{r:"Isaiah 7:14",t:"Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel."},
{r:"Isaiah 9:6",t:"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace."},
{r:"Isaiah 40:31",t:"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."},
{r:"Isaiah 53:5",t:"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},
{r:"Jeremiah 29:11",t:"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end."},
{r:"Joel 2:28",t:"And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:"},
{r:"Micah 6:8",t:"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?"},
{r:"Matthew 5:3-10",t:"Blessed are the poor in spirit: for theirs is the kingdom of heaven. Blessed are they that mourn: for they shall be comforted. Blessed are the meek: for they shall inherit the earth. Blessed are they which do hunger and thirst after righteousness: for they shall be filled. Blessed are the merciful: for they shall obtain mercy. Blessed are the pure in heart: for they shall see God. Blessed are the peacemakers: for they shall be called the children of God. Blessed are they which are persecuted for righteousness' sake: for theirs is the kingdom of heaven."},
{r:"Matthew 5:16-17",t:"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven. Think not that I am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil."},
{r:"Matthew 5:44",t:"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;"},
{r:"Matthew 6:33",t:"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."},
{r:"Matthew 7:13-14",t:"Enter ye in at the strait gate: for wide is the gate, and broad is the way, that leadeth to destruction, and many there be which go in thereat: Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it."},
{r:"Matthew 10:32",t:"Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven."},
{r:"Matthew 11:28-30",t:"Come unto me, all ye that labour and are heavy laden, and I will give you rest. Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls. For my yoke is easy, and my burden is light."},
{r:"Matthew 12:30",t:"He that is not with me is against me; and he that gathereth not with me scattereth abroad."},
{r:"Matthew 16:16-18",t:"And Simon Peter answered and said, Thou art the Christ, the Son of the living God. And Jesus answered and said unto him, Blessed art thou, Simon Barjona: for flesh and blood hath not revealed it unto thee, but my Father which is in heaven. And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it."},
{r:"Matthew 22:37-40",t:"Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the first and great commandment. And the second is like unto it, Thou shalt love thy neighbour as thyself. On these two commandments hang all the law and the prophets."},
{r:"Matthew 25:31",t:"When the Son of man shall come in his glory, and all the holy angels with him, then shall he sit upon the throne of his glory:"},
{r:"Matthew 28:18-20",t:"And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth. Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."},
{r:"Mark 16:16",t:"He that believeth and is baptized shall be saved; but he that believeth not shall be damned."},
{r:"Luke 6:33",t:"And if ye do good to them which do good to you, what thank have ye? for sinners also do even the same."},
{r:"Luke 23:43",t:"And Jesus said unto him, Verily I say unto thee, To day shalt thou be with me in paradise."},
{r:"John 1:1-3",t:"In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by him; and without him was not any thing made that was made."},
{r:"John 1:12",t:"But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name:"},
{r:"John 1:14",t:"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."},
{r:"John 1:29",t:"The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world."},
{r:"John 3:3",t:"Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God."},
{r:"John 3:5-6",t:"Jesus answered, Verily, verily, I say unto thee, Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God. That which is born of the flesh is flesh; and that which is born of the Spirit is spirit."},
{r:"John 3:14-17",t:"And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up: That whosoever believeth in him should not perish, but have eternal life. For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life. For God sent not his Son into the world to condemn the world; but that the world through him might be saved."},
{r:"John 4:24",t:"God is a Spirit: and they that worship him must worship him in spirit and in truth."},
{r:"John 5:22-24",t:"For the Father judgeth no man, but hath committed all judgment unto the Son: That all men should honour the Son, even as they honour the Father. He that honoureth not the Son honoureth not the Father which hath sent him. Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life."},
{r:"John 8:31-32",t:"Then said Jesus to those Jews which believed on him, If ye continue in my word, then are ye my disciples indeed; And ye shall know the truth, and the truth shall make you free."},
{r:"John 8:44",t:"Ye are of your father the devil, and the lusts of your father ye will do. He was a murderer from the beginning, and abode not in the truth, because there is no truth in him. When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it."},
{r:"John 10:10",t:"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly."},
{r:"John 10:27-29",t:"My sheep hear my voice, and I know them, and they follow me: And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand. My Father, which gave them me, is greater than all; and no man is able to pluck them out of my Father's hand."},
{r:"John 13:34-35",t:"A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another. By this shall all men know that ye are my disciples, if ye have love one to another."},
{r:"John 14:6",t:"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."},
{r:"John 14:15-16",t:"If ye love me, keep my commandments. And I will pray the Father, and he shall give you another Comforter, that he may abide with you for ever;"},
{r:"John 14:26",t:"But the Comforter, which is the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you."},
{r:"John 15:7",t:"If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you."},
{r:"John 16:13",t:"Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come."},
{r:"Acts 1:8",t:"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judaea, and in Samaria, and unto the uttermost part of the earth."},
{r:"Acts 2:38",t:"Then Peter said unto them, Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost."},
{r:"Acts 4:12",t:"Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved."},
{r:"Romans 1:16",t:"For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth; to the Jew first, and also to the Greek."},
{r:"Romans 1:18-19",t:"For the wrath of God is revealed from heaven against all ungodliness and unrighteousness of men, who hold the truth in unrighteousness; Because that which may be known of God is manifest in them; for God hath shewed it unto them."},
{r:"Romans 3:10",t:"As it is written, There is none righteous, no, not one:"},
{r:"Romans 3:23",t:"For all have sinned, and come short of the glory of God;"},
{r:"Romans 5:1",t:"Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:"},
{r:"Romans 5:8",t:"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."},
{r:"Romans 5:12",t:"Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"},
{r:"Romans 6:23",t:"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."},
{r:"Romans 8:1",t:"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit."},
{r:"Romans 8:28",t:"And we know that all things work together for good to them that love God, to them who are the called according to his purpose."},
{r:"Romans 8:38-39",t:"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord."},
{r:"Romans 10:4",t:"For Christ is the end of the law for righteousness to every one that believeth."},
{r:"Romans 10:9-10",t:"That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved. For with the heart man believeth unto righteousness; and with the mouth confession is made unto salvation."},
{r:"Romans 10:13",t:"For whosoever shall call upon the name of the Lord shall be saved."},
{r:"Romans 10:17",t:"So then faith cometh by hearing, and hearing by the word of God."},
{r:"Romans 12:1-2",t:"I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."},
{r:"Romans 13:1",t:"Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God."},
{r:"2 Corinthians 5:17",t:"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."},
{r:"Galatians 2:20",t:"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me."},
{r:"Galatians 3:11",t:"But that no man is justified by the law in the sight of God, it is evident: for, The just shall live by faith."},
{r:"Galatians 5:14",t:"For all the law is fulfilled in one word, even in this; Thou shalt love thy neighbour as thyself."},
{r:"Galatians 5:16",t:"This I say then, Walk in the Spirit, and ye shall not fulfil the lust of the flesh."},
{r:"Galatians 5:22-23",t:"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law."},
{r:"Ephesians 2:8-10",t:"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast. For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them."},
{r:"Ephesians 4:11-13",t:"And he gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers; For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ: Till we all come in the unity of the faith, and of the knowledge of the Son of God, unto a perfect man, unto the measure of the stature of the fulness of Christ:"},
{r:"Ephesians 6:10-11",t:"Finally, my brethren, be strong in the Lord, and in the power of his might. Put on the whole armour of God, that ye may be able to stand against the wiles of the devil."},
{r:"Philippians 2:5-8",t:"Let this mind be in you, which was also in Christ Jesus: Who, being in the form of God, thought it not robbery to be equal with God: But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men: And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."},
{r:"Philippians 4:6-8",t:"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus. Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things."},
{r:"Philippians 4:13",t:"I can do all things through Christ which strengtheneth me."},
{r:"Colossians 1:15-17",t:"Who is the image of the invisible God, the firstborn of every creature: For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him: And he is before all things, and by him all things consist."},
{r:"Colossians 3:1-2",t:"If ye then be risen with Christ, seek those things which are above, where Christ sitteth on the right hand of God. Set your affection on things above, not on things on the earth."},
{r:"1 Timothy 2:5",t:"For there is one God, and one mediator between God and men, the man Christ Jesus;"},
{r:"2 Timothy 2:15",t:"Study to shew thyself approved unto God, a workman that needeth not to be ashamed, rightly dividing the word of truth."},
{r:"2 Timothy 3:16",t:"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:"},
{r:"Titus 2:11",t:"For the grace of God that bringeth salvation hath appeared to all men,"},
{r:"Titus 3:5",t:"Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;"},
{r:"Hebrews 1:3",t:"Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;"},
{r:"Hebrews 4:12",t:"For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart."},
{r:"Hebrews 5:8-10",t:"Though he were a Son, yet learned he obedience by the things which he suffered; And being made perfect, he became the author of eternal salvation unto all them that obey him; Called of God an high priest after the order of Melchisedec."},
{r:"Hebrews 11:1",t:"Now faith is the substance of things hoped for, the evidence of things not seen."},
{r:"Hebrews 11:6",t:"But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him."},
{r:"Hebrews 12:1",t:"Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,"},
{r:"James 1:2-5",t:"My brethren, count it all joy when ye fall into divers temptations; Knowing this, that the trying of your faith worketh patience. But let patience have her perfect work, that ye may be perfect and entire, wanting nothing. If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."},
{r:"James 1:22",t:"But be ye doers of the word, and not hearers only, deceiving your own selves."},
{r:"James 5:16",t:"Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much."},
{r:"1 John 1:9",t:"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness."},
{r:"1 John 5:12-13",t:"He that hath the Son hath life; and he that hath not the Son of God hath not life. These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God."}
