<html lang="en">

<style id="css">
/* Layout idea: one-screen study desk. Filters on top, one large card with a ribbon stripe in the middle, thumb controls at the bottom. */
:root{
  --paper:#eef1f4; --surface:#ffffff; --ink:#1b2a41; --muted:#5d6b7e; --line:#cfd6de;
  --accent:#8a1c35; --on-accent:#ffffff;
  --c-chapter:#274c77; --c-verse:#8a1c35; --c-person:#4f6b2f; --c-place:#9a5a12;
  --shadow:0 10px 30px rgba(27,42,65,.12);
  --f-card:"Spectral", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111822; --surface:#1b2532; --ink:#e8edf3; --muted:#9aa8b8; --line:#2f3c4d;
    --accent:#e08a9b; --on-accent:#1b1014;
    --c-chapter:#8fb4e0; --c-verse:#e08a9b; --c-person:#a9c784; --c-place:#e3b06a;
    --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111822; --surface:#1b2532; --ink:#e8edf3; --muted:#9aa8b8; --line:#2f3c4d;
  --accent:#e08a9b; --on-accent:#1b1014;
  --c-chapter:#8fb4e0; --c-verse:#e08a9b; --c-person:#a9c784; --c-place:#e3b06a;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;height:100dvh;max-width:640px;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-family:var(--f-card);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.01em}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem;white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.chip[data-cat="chapters"] .dot{background:var(--c-chapter)}
.chip[data-cat="verses"] .dot{background:var(--c-verse)}
.chip[data-cat="people"] .dot{background:var(--c-person)}
.chip[data-cat="places"] .dot{background:var(--c-place)}
.chip small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{flex:1;min-width:140px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
[hidden]{display:none !important}

.stage{flex:1;min-height:220px;perspective:1400px}
.card{position:relative;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;text-align:left;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.face::before{content:"";height:7px;background:var(--cat);flex:none}
.back{transform:rotateY(180deg)}
.eyebrow{padding:14px 20px 0;font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--cat)}
.front .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 20px 20px}
.front .title{font-family:var(--f-card);font-weight:600;font-size:clamp(2rem,9vw,3rem);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.front .sub{color:var(--muted);margin-top:8px}
.hint{padding:0 20px 14px;color:var(--muted);font-size:.85rem}
.back .body{flex:1;overflow-y:auto;padding:10px 20px 20px;font-family:var(--f-card);font-size:1.2rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{height:100%;border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--muted)}

.nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.nav .btn{padding:14px 10px;font-size:1rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.note{color:var(--muted);font-size:.85rem;min-height:1.2em;margin:0}

.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--f-card);margin:0;font-size:1.25rem}
.sheet label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.9rem}
.sheet input,.sheet textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;font-weight:400}
.sheet textarea{min-height:120px;font-family:var(--f-card);font-size:1.05rem;resize:vertical}
.sheet .row{justify-content:flex-end}
.dup{margin:0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:.9rem}
.dup.stop{border-color:var(--accent);color:var(--accent);font-weight:600}
.sheet.tall{height:100%}
.sheet input[type=search]{font-family:var(--f-ui)}
.vlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
.vrow.isdup{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.vmain{flex:1;min-width:0}
.vref{font-weight:700}
.vtxt{color:var(--muted);font-family:var(--f-card);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:.72rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.tag.warn{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:.82rem;flex:none}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>

<div id="app"></div>
<script id="cards">
window.CARDS={
chapters:{
Genesis:[
"God creates the heavens and the earth in six days, speaking light, sky, land, plants, sun, moon, stars, sea creatures, birds and animals into being. He makes man and woman in His own image and calls it all very good.",
"God rests on the seventh day and blesses it. The chapter retells the forming of man from dust, the garden of Eden, the one forbidden tree, and the making of woman from Adam's rib as the first marriage.",
"The serpent deceives Eve, and she and Adam eat the forbidden fruit. Sin, shame and the curse enter the world. God promises a Seed who will bruise the serpent's head, clothes the couple, and sends them out of Eden.",
"Cain and Abel bring offerings and God accepts Abel's. Cain murders his brother and is sent away as a wanderer. Cain's family builds a city and trades; Seth is born, and people begin to call on the name of the Lord.",
"The family line from Adam to Noah through Seth, with very long lives that each end in death. Enoch walks with God and is taken without dying. Methuselah lives 969 years.",
"Wickedness and violence fill the earth and God is grieved. Noah finds grace in the Lord's eyes. God tells him to build an ark and promises a covenant to save his family and the animals.",
"Noah, his family and the animals enter the ark. Rain falls forty days and nights, the fountains of the deep break open, and the flood covers the mountains. Everything on dry land dies, and the waters prevail 150 days.",
"God remembers Noah and the waters go down. The ark rests on the mountains of Ararat; Noah sends out a raven and a dove. He leaves the ark and builds an altar, and God promises the seasons will continue.",
"God blesses Noah, permits eating meat, requires an accounting for human life, and sets the rainbow as the sign of His covenant never to flood the earth again. Noah gets drunk; Ham dishonors him and Canaan is cursed.",
"The Table of Nations: the descendants of Japheth, Ham and Shem spread out by families, languages and lands. Nimrod is noted as a mighty hunter and kingdom builder.",
"People build the tower of Babel to make a name for themselves; God confuses their language and scatters them. The line from Shem leads to Abram, whose father Terah leaves Ur and settles in Haran.",
"God calls Abram to leave his country, promising to make him a great nation and to bless all families of the earth through him. Abram travels to Canaan and builds altars. In Egypt during a famine he passes Sarai off as his sister.",
"Abram and Lot separate because their herds are too large. Lot chooses the well-watered Jordan plain near Sodom. God renews the promise of the land and of descendants like the dust; Abram settles at Hebron.",
"Four kings defeat five and carry off Lot. Abram rescues him with 318 trained men. Melchizedek, king of Salem and priest of God Most High, blesses Abram, who gives him a tenth and refuses the king of Sodom's spoils.",
"God promises Abram an heir from his own body and descendants like the stars. Abram believes, and it is counted to him as righteousness. God makes a covenant, foretelling 400 years of affliction and the gift of the land.",
"Sarai gives her maid Hagar to Abram to bear a child. Hagar conceives, is treated harshly and flees. The Angel of the Lord meets her at a spring, and she names God the One who sees. Ishmael is born.",
"When Abram is 99, God renames him Abraham and Sarai Sarah, gives circumcision as the covenant sign, and promises a son named Isaac. Abraham circumcises every male in his household that day.",
"Three visitors come to Abraham at Mamre. The Lord promises Sarah a son within the year and she laughs. Abraham then pleads for Sodom, and God agrees to spare it if ten righteous are found.",
"Two angels bring Lot's family out of Sodom before God destroys Sodom and Gomorrah with brimstone and fire. Lot's wife looks back and becomes a pillar of salt. Lot's daughters bear Moab and Ben-Ammi.",
"In Gerar Abraham again says Sarah is his sister, and King Abimelech takes her. God warns Abimelech in a dream; he returns her with gifts, and Abraham prays for the healing of his household.",
"Isaac is born as promised. Hagar and Ishmael are sent away, and God hears the boy and provides water in the wilderness. Abraham and Abimelech make a covenant at Beersheba.",
"God tests Abraham by asking for Isaac as a burnt offering on Moriah. Abraham obeys, the Angel of the Lord stops him, and a ram is provided instead. God confirms His promise with an oath.",
"Sarah dies at 127 in Hebron. Abraham buys the field and cave of Machpelah from Ephron the Hittite for 400 shekels of silver as a burial place, his first owned piece of the promised land.",
"Abraham sends his servant to his relatives to find a wife for Isaac. The servant prays at the well, and Rebekah waters his camels as the sign. She agrees to go, and Isaac marries her.",
"Abraham marries Keturah, dies at 175 and is buried by Isaac and Ishmael. Ishmael's line is listed. Rebekah bears twins, Esau and Jacob, and Esau sells his birthright for a bowl of stew.",
"During a famine Isaac stays in Gerar and God repeats Abraham's promise to him. He calls Rebekah his sister, prospers greatly, moves from well to well over quarrels, and makes peace with Abimelech at Beersheba.",
"With Rebekah's help Jacob disguises himself and receives from blind Isaac the blessing meant for Esau. Esau weeps and plans to kill him, so Rebekah arranges for Jacob to flee to her brother Laban.",
"Isaac sends Jacob to Padan Aram for a wife. At Bethel Jacob dreams of a ladder reaching heaven and God repeats the covenant promise to him. Jacob sets up a pillar and vows to give a tenth.",
"Jacob meets Rachel at a well and works seven years for her, but Laban gives him Leah. He marries Rachel too and serves seven more years. Leah bears Reuben, Simeon, Levi and Judah.",
"Rachel and Leah compete for children. Sons are born through Bilhah and Zilpah; Leah bears Issachar, Zebulun and Dinah; Rachel finally bears Joseph. Jacob's flocks multiply under his wage deal with Laban.",
"God tells Jacob to return home, and he leaves secretly while Rachel takes her father's household idols. Laban pursues but is warned by God in a dream. They make a covenant at Mizpah.",
"Jacob fears meeting Esau, prays, and sends gifts ahead. Alone at night he wrestles with a Man until daybreak, is renamed Israel, and leaves Peniel limping but blessed.",
"Esau runs to embrace Jacob and the brothers are reconciled. Jacob settles near Shechem, buys land, and builds an altar to the God of Israel.",
"Shechem violates Dinah and asks to marry her. Her brothers deceitfully require circumcision, then Simeon and Levi kill the men of the city. Jacob rebukes them for the trouble they have brought.",
"Jacob returns to Bethel after his household puts away foreign gods. God confirms the name Israel and the promise. Rachel dies giving birth to Benjamin; Reuben sins; Isaac dies at 180.",
"The family record of Esau, who is Edom: his wives, sons, chiefs, and the kings who ruled in Edom before Israel had a king.",
"Joseph, favored by Jacob and given a tunic of many colors, dreams that his family will bow to him. His brothers sell him for twenty shekels of silver and deceive Jacob with the bloodied tunic. He is sold to Potiphar in Egypt.",
"Judah's sons die and he withholds his third son from Tamar. She disguises herself and conceives by Judah, who admits she is more righteous than he. Twins Perez and Zerah are born.",
"The Lord is with Joseph and he runs Potiphar's house. He refuses the advances of Potiphar's wife, is falsely accused and jailed, and there too the Lord gives him favor and charge of the prison.",
"In prison Joseph interprets the dreams of Pharaoh's chief butler and chief baker. Three days later the butler is restored and the baker hanged, just as he said, but the butler forgets Joseph.",
"Pharaoh dreams of cows and heads of grain. Joseph explains seven years of plenty followed by seven of famine and is made ruler over Egypt at thirty. Manasseh and Ephraim are born, and the famine begins.",
"Ten of Joseph's brothers come to buy grain and bow before him without recognizing him. He accuses them of spying, keeps Simeon, demands Benjamin, and returns their money in their sacks.",
"With the grain gone, Judah pledges himself for Benjamin's safety and the brothers return to Egypt. Joseph hosts them for a meal, seats them by age, and gives Benjamin five times as much.",
"Joseph has his silver cup hidden in Benjamin's sack and the brothers are brought back. Judah pleads for his father's sake and offers to stay as a slave in Benjamin's place.",
"Joseph reveals himself and weeps with his brothers, saying God sent him ahead to preserve life. Pharaoh invites the whole family to Egypt, and Jacob learns that Joseph is alive.",
"God reassures Jacob at Beersheba and he travels to Egypt with his whole family, seventy persons in all. Joseph meets his father in Goshen.",
"The family settles in Goshen and Jacob blesses Pharaoh. As the famine deepens Joseph gathers Egypt's money, livestock and land for Pharaoh. Jacob makes Joseph swear to bury him in Canaan.",
"Jacob takes Joseph's sons Ephraim and Manasseh as his own and blesses them, crossing his hands to set the younger Ephraim ahead of Manasseh.",
"Jacob speaks a prophetic word over each of his twelve sons. The scepter will not depart from Judah until Shiloh comes. He charges them to bury him at Machpelah and dies.",
"Joseph buries Jacob in Canaan. He reassures his fearful brothers that what they meant for evil God meant for good. Joseph dies at 110 after making Israel swear to carry his bones out of Egypt."
],
John:[
"The Word was with God, was God, and became flesh and dwelt among us. John the Baptist points to Jesus as the Lamb of God. Andrew, Peter, Philip and Nathanael become the first disciples.",
"At a wedding in Cana Jesus turns water into wine, His first sign. In Jerusalem at Passover He drives the merchants out of the temple and speaks of raising the temple of His body in three days.",
"Jesus tells Nicodemus that a person must be born again to see the kingdom of God, and that God gave His only Son so believers would have everlasting life. John the Baptist says Jesus must increase while he decreases.",
"At Jacob's well Jesus offers a Samaritan woman living water and teaches that true worship is in spirit and truth. Many Samaritans believe. Back in Galilee He heals a nobleman's son from a distance.",
"Jesus heals a man who had been ill thirty-eight years at the pool of Bethesda on the Sabbath. Facing opposition, He explains His authority from the Father and the witnesses that testify of Him.",
"Jesus feeds five thousand with five barley loaves and two fish and walks on the sea. He teaches that He is the bread of life. Many disciples turn back, but Peter says He has the words of eternal life.",
"Jesus teaches in the temple at the Feast of Tabernacles and the crowd is divided over Him. He invites the thirsty to come to Him for rivers of living water. Officers sent to arrest Him return empty-handed.",
"Jesus refuses to condemn a woman caught in adultery, calls Himself the light of the world, and says the truth sets people free. He claims to have existed before Abraham, and they pick up stones.",
"Jesus heals a man blind from birth with clay and washing in the pool of Siloam. The Pharisees question and expel the man, who then worships Jesus. Jesus speaks about spiritual blindness.",
"Jesus is the door of the sheep and the good shepherd who lays down His life for them. At the Feast of Dedication He says He and the Father are one, and they try again to stone Him.",
"Lazarus of Bethany dies. Jesus tells Martha He is the resurrection and the life, weeps at the tomb, and raises Lazarus after four days. The council, led by Caiaphas, plots to put Jesus to death.",
"Mary anoints Jesus' feet with costly oil. He rides into Jerusalem on a donkey to shouts of Hosanna, speaks of a grain of wheat dying to bear fruit, and a voice answers from heaven. Many still do not believe.",
"Jesus washes His disciples' feet as an example of service, foretells Judas's betrayal, gives the new commandment to love one another, and predicts Peter's three denials.",
"Jesus comforts His disciples: He goes to prepare a place and is the way, the truth and the life. He promises the Helper, the Holy Spirit, and leaves them His peace.",
"Jesus is the true vine and His followers are branches who bear fruit only by abiding in Him. He calls them friends, commands them to love one another, and warns that the world will hate them.",
"Jesus explains the Holy Spirit's work of convicting the world and guiding into all truth. Their sorrow will turn to joy. In the world they will have tribulation, but He has overcome the world.",
"Jesus prays to the Father: for His own glory, for the protection and sanctifying of His disciples, and for the unity of all who will believe through their word.",
"Jesus is betrayed and arrested in the garden; Peter cuts off Malchus's ear. Jesus is questioned by Annas and Caiaphas while Peter denies Him three times. Before Pilate He says His kingdom is not of this world; the crowd chooses Barabbas.",
"Jesus is scourged, crowned with thorns and handed over. He is crucified at Golgotha, entrusts His mother to the beloved disciple, and declares His work finished. His side is pierced, and Joseph of Arimathea and Nicodemus bury Him.",
"Mary Magdalene finds the tomb empty and is the first to see the risen Lord. Jesus appears to the disciples and breathes the Holy Spirit on them. Thomas sees and confesses Him as Lord and God.",
"Jesus appears at the Sea of Tiberias and gives a catch of 153 fish. After breakfast He restores Peter three times, charging him to feed His sheep, and speaks of Peter's future and of the beloved disciple."
],
Exodus:[
"Jacob's family multiplies in Egypt until a new Pharaoh enslaves them. He orders the Hebrew midwives to kill newborn boys, but they fear God and refuse, so Pharaoh commands that every son be thrown into the river.",
"Moses is born, hidden in a basket among the reeds, and adopted by Pharaoh's daughter. As a man he kills an Egyptian, flees to Midian and marries Zipporah. God hears Israel's groaning and remembers His covenant.",
"God speaks to Moses from a burning bush that is not consumed and sends him to bring Israel out of Egypt. He reveals His name, I AM, and promises a land flowing with milk and honey.",
"God gives Moses signs: a rod that becomes a serpent, a leprous hand, and water turned to blood. Moses objects that he cannot speak well, so Aaron is appointed spokesman. The elders of Israel believe and worship.",
"Moses and Aaron ask Pharaoh to let Israel go. He refuses and makes the slaves gather their own straw while keeping the same brick quota. The people blame Moses, and Moses cries out to God.",
"God answers with a series of promises to redeem Israel and bring them into the land. The people are too crushed to listen. The family line of Moses and Aaron is recorded.",
"Aaron's rod becomes a serpent and swallows the magicians' rods, yet Pharaoh's heart is hard. The first plague turns the Nile and all Egypt's water to blood.",
"Plagues of frogs, lice and flies strike Egypt. The magicians admit it is the finger of God, and Goshen is spared from the flies, but Pharaoh hardens his heart each time relief comes.",
"Disease kills Egypt's livestock, boils break out on people and animals, and a devastating hail destroys crops. Pharaoh admits he has sinned, then hardens his heart again when the hail stops.",
"Locusts devour what the hail left, and thick darkness covers Egypt for three days while Israel has light. Pharaoh bargains but will not release the people and their flocks.",
"God announces the last plague: every firstborn in Egypt will die at midnight. The Israelites are told to ask their neighbors for silver and gold, and Moses leaves Pharaoh in anger.",
"God institutes the Passover: a lamb is killed, its blood put on the doorposts, and unleavened bread eaten in haste. The firstborn of Egypt die, and Israel leaves after 430 years.",
"Every firstborn is set apart to the Lord and the Feast of Unleavened Bread is commanded as a memorial. Israel takes Joseph's bones, and God leads by a pillar of cloud by day and fire by night.",
"Pharaoh's army traps Israel at the Red Sea. God parts the water, Israel crosses on dry ground, and the returning sea drowns the Egyptians. The people fear the Lord and believe.",
"Moses and Israel sing of the Lord's triumph, and Miriam leads the women with timbrels. At Marah bitter water is made sweet, and the people camp at Elim with its twelve wells.",
"The people complain of hunger, and God sends quail and then manna each morning. They gather daily, with a double portion on the sixth day so they can rest on the Sabbath.",
"At Rephidim God gives water from a rock when Moses strikes it. Amalek attacks, and Israel prevails while Aaron and Hur hold up Moses' hands. Moses builds an altar called The-Lord-Is-My-Banner.",
"Jethro, Moses' father-in-law, visits and rejoices at what God has done. Seeing Moses judge alone all day, he advises appointing able men over thousands, hundreds, fifties and tens.",
"Israel camps at Mount Sinai. God offers to make them His special treasure, a kingdom of priests and a holy nation. The people prepare, and God descends on the mountain in fire, smoke and thunder.",
"God speaks the Ten Commandments. The frightened people ask Moses to speak to them in God's place, and God gives instructions about altars.",
"Laws about Hebrew servants, violence and personal injury, including life for life and eye for eye, and an owner's responsibility for dangerous animals.",
"Laws on theft, property damage and restitution, along with moral commands and protections for strangers, widows, orphans and the poor.",
"Laws of justice and mercy, the Sabbath year and day, and three yearly feasts. God promises to send His Angel ahead to bring Israel into the land little by little.",
"The people agree to the covenant and Moses seals it with blood. Moses, Aaron and the elders see God and eat before Him. Moses then enters the cloud on the mountain for forty days and nights.",
"God asks for willing offerings to build a sanctuary and gives the pattern for the ark of the covenant with its mercy seat, the table of showbread, and the gold lampstand.",
"Instructions for the tabernacle itself: its curtains and coverings, its boards and bars, and the veil dividing the Holy Place from the Most Holy.",
"Instructions for the bronze altar of burnt offering, the outer court with its hangings, and the pure oil to keep the lamp burning.",
"Holy garments for Aaron and his sons: the ephod, the breastplate with twelve stones for the tribes, the Urim and Thummim, the robe, and a gold plate reading Holiness to the Lord.",
"The seven-day ceremony for consecrating Aaron and his sons as priests, and the daily morning and evening offerings. God promises to dwell among Israel.",
"Instructions for the altar of incense, the half-shekel ransom, the bronze laver, the holy anointing oil and the incense.",
"God fills Bezalel and Aholiab with His Spirit for skilled craftsmanship. The Sabbath is given as a sign of the covenant, and Moses receives two stone tablets written by the finger of God.",
"While Moses is on the mountain the people have Aaron make a golden calf. Moses intercedes, breaks the tablets, and destroys the calf. The Levites stand with him and about three thousand die.",
"God says He will not go in Israel's midst. Moses meets with God face to face at the tent of meeting, pleads for His presence, and asks to see His glory.",
"Moses cuts new tablets, and the Lord passes by proclaiming Himself merciful and gracious. The covenant is renewed, and Moses' face shines when he comes down.",
"Moses repeats the Sabbath command and calls for offerings. The people bring willingly, and Bezalel and Aholiab are named to lead the work.",
"The people give more than enough and are told to stop. The craftsmen make the tabernacle's curtains, boards and veil.",
"Bezalel makes the ark and mercy seat, the table, the lampstand, the altar of incense, and the anointing oil and incense.",
"The bronze altar, the laver and the court are made, and an inventory records the gold, silver and bronze used.",
"The priestly garments are made. All the work is finished just as the Lord commanded, and Moses inspects it and blesses the people.",
"Moses sets up the tabernacle on the first day of the first month of the second year. The cloud covers it and the glory of the Lord fills it, and the cloud guides all Israel's journeys."
],
Leviticus:[
"The burnt offering from the herd, the flock or birds. The animal must be without blemish and is wholly burned on the altar as a sweet aroma to the Lord.",
"The grain offering of fine flour with oil and frankincense. It must have no leaven or honey and is always seasoned with salt.",
"The peace offering from herd or flock. The fat is burned to the Lord, and Israel is never to eat fat or blood.",
"The sin offering for unintentional sin, with different requirements for a priest, the whole congregation, a ruler, or a common person.",
"Situations that require confession and a trespass offering, with cheaper options for the poor. Wrongs against holy things are repaid with a fifth added.",
"Restitution for cheating a neighbor, and instructions to the priests about the burnt, grain and sin offerings. The altar fire must never go out.",
"The law of the trespass and peace offerings, the portions that belong to the priests, and the ban on eating fat or blood.",
"Moses consecrates Aaron and his sons with washing, garments, anointing oil and offerings. They remain at the tabernacle seven days.",
"Aaron begins his ministry with offerings for himself and the people. The glory of the Lord appears, and fire comes out and consumes the offering.",
"Nadab and Abihu offer profane fire and die before the Lord. Priests are told not to drink wine when serving and to distinguish holy from unholy.",
"Which animals, fish, birds and insects are clean or unclean to eat. God calls Israel to be holy because He is holy.",
"Purification for a woman after childbirth and the offering she brings.",
"How priests examine skin diseases and mildew in garments. A person declared unclean lives outside the camp.",
"The ritual for cleansing a healed leper, with offerings scaled for the poor, and how to deal with leprosy in a house.",
"Laws about bodily discharges in men and women and how to be cleansed from them.",
"The Day of Atonement. Once a year the high priest enters the Most Holy Place with blood, and a scapegoat carries the people's sins into the wilderness.",
"Sacrifices must be brought to the tabernacle. Eating blood is forbidden, because the life of the flesh is in the blood and it is given for atonement.",
"Israel must not copy Egypt or Canaan. The chapter forbids incest and other sexual sins and sacrificing children to Molech.",
"A call to be holy in everyday life: honor parents, leave gleanings for the poor, deal honestly, and love your neighbor as yourself.",
"Penalties for Molech worship, consulting mediums, cursing parents and sexual sins. Israel is to be set apart from the nations.",
"Higher standards for priests in mourning and marriage, and physical defects that bar a priest from serving at the altar.",
"Priests must treat the holy offerings with reverence, and sacrifices must be without blemish to be accepted.",
"The appointed feasts: the Sabbath, Passover and Unleavened Bread, Firstfruits, Weeks, Trumpets, the Day of Atonement, and Tabernacles.",
"Care of the lamps and the showbread. A man who blasphemes the Name is stoned, and the same standard of justice applies to native and stranger.",
"The land rests every seventh year. Every fiftieth year is the Jubilee, when liberty is proclaimed, land returns to its family, and poor relatives are redeemed.",
"Blessings for obedience and escalating punishments for disobedience, ending in exile. God promises to remember His covenant if they confess.",
"Rules for vows and things dedicated to the Lord, how they are valued and redeemed, and the tithe that is holy to the Lord."
],
Numbers:[
"A census counts 603,550 fighting men twenty and older. The Levites are not numbered with them because they care for the tabernacle.",
"The tribes camp in four groups around the tabernacle, each under its own standard, and march in the same order.",
"The Levites are given to assist Aaron. The clans of Gershon, Kohath and Merari receive their duties, and the Levites are taken in place of Israel's firstborn.",
"The detailed duties of the Kohathites, Gershonites and Merarites in carrying the tabernacle, and a count of those aged thirty to fifty.",
"The unclean are sent outside the camp, wrongs are repaid with a fifth added, and a test is given for a wife suspected of unfaithfulness.",
"The Nazirite vow of separation: no wine, no razor, no contact with the dead. The chapter ends with the priestly blessing.",
"The leaders of the twelve tribes bring identical offerings over twelve days for the dedication of the altar. Moses hears God's voice from above the mercy seat.",
"The lampstand is set up, and the Levites are cleansed and presented to the Lord to serve from age twenty-five to fifty.",
"Israel keeps the second Passover, with a later date for those unclean or traveling. The cloud over the tabernacle tells them when to camp and when to move.",
"Two silver trumpets signal assembly and march. Israel leaves Sinai in order, and Moses invites Hobab to come as a guide.",
"The people complain and fire burns at Taberah. They crave meat; God puts His Spirit on seventy elders to help Moses and sends quail followed by a plague.",
"Miriam and Aaron speak against Moses. God defends him as His faithful servant, and Miriam is leprous for seven days. Moses is called very humble.",
"Twelve spies explore Canaan for forty days and bring back a huge cluster of grapes. Ten warn of giants and fortified cities; Caleb urges the people to go up.",
"The people weep and want to return to Egypt. Joshua and Caleb plead, Moses intercedes, and God sentences that generation to forty years in the wilderness. A rash attack fails.",
"Laws for offerings once in the land, the difference between unintentional and defiant sin, a Sabbath breaker stoned, and tassels to remind Israel of the commandments.",
"Korah, Dathan and Abiram rebel against Moses and Aaron. The earth swallows them, fire consumes 250 men, and a plague kills 14,700 until Aaron stands with incense.",
"Twelve rods are placed before the Lord, and Aaron's rod buds, blossoms and bears almonds, confirming his priesthood.",
"The duties of priests and Levites and their support from offerings and tithes. The Levites give a tenth of the tithe they receive.",
"The ashes of a red heifer are used to make water of purification for anyone who touches a dead body.",
"Miriam dies. Moses strikes the rock at Meribah in anger and is barred from the land. Edom refuses passage, and Aaron dies on Mount Hor with Eleazar succeeding him.",
"Israel defeats Arad. When the people complain, fiery serpents bite them and those who look at the bronze serpent live. Israel defeats Sihon and Og.",
"Balak king of Moab hires Balaam to curse Israel. On the way Balaam's donkey sees the Angel of the Lord and speaks to him.",
"Balaam's first two oracles bless Israel and not curse them. He declares that God is not a man that He should lie.",
"Balaam blesses Israel a third time, then foretells a Star out of Jacob and a Scepter rising from Israel.",
"Israel joins in immorality and worships Baal of Peor. A plague kills 24,000 until Phinehas acts, and God gives him a covenant of peace.",
"A second census counts 601,730. Of the generation counted at Sinai, only Caleb and Joshua remain.",
"The daughters of Zelophehad are granted their father's inheritance. Moses is told he will die, and Joshua is commissioned to succeed him.",
"The required offerings for each day, the Sabbath, the new month, Passover and the Feast of Weeks.",
"The offerings for the Feast of Trumpets, the Day of Atonement, and the eight days of Tabernacles.",
"A vow to the Lord must be kept. Rules are given for when a father or husband may cancel a woman's vow.",
"Israel takes vengeance on Midian and Balaam is killed. The soldiers are purified and the plunder is divided, with a share for the Lord.",
"Reuben, Gad and half of Manasseh ask for land east of the Jordan. Moses agrees once they promise to fight alongside the other tribes first.",
"A list of Israel's camping places from Egypt to the plains of Moab, and a command to drive out the people of Canaan and destroy their idols.",
"The borders of the promised land are laid out, and leaders are named to divide it among the tribes.",
"The Levites receive forty-eight cities, six of them cities of refuge for anyone who kills by accident. Murder and manslaughter are distinguished.",
"Zelophehad's daughters are to marry within their own tribe so that each tribe's inheritance stays in place."
],
Deuteronomy:[
"Moses begins his farewell by recalling the journey from Horeb to Kadesh: leaders appointed, spies sent, the people's refusal to enter, and God's sentence.",
"The wilderness years end. Israel passes peacefully by Edom, Moab and Ammon and defeats Sihon king of Heshbon.",
"Israel defeats Og of Bashan, and the land east of the Jordan goes to two and a half tribes. Moses pleads to cross over but may only view the land from Pisgah.",
"Moses urges obedience without adding to or taking from God's word. Israel must remember Horeb and shun idols, for the Lord alone is God. Three cities of refuge are set apart.",
"Moses repeats the Ten Commandments and recalls how the people, afraid of God's voice, asked him to stand between them and the Lord.",
"The Lord is one, and Israel is to love Him with all the heart, soul and strength. These words are to be taught diligently to children and not forgotten in prosperity.",
"Israel must destroy the nations of Canaan and not intermarry with them. God chose Israel out of love, not for its size, and promises blessing for obedience.",
"Remember the wilderness, where God taught that man does not live by bread alone. Do not forget Him when you prosper, for He gives the power to get wealth.",
"Israel is not receiving the land for its own righteousness. Moses recalls the golden calf and other rebellions and how he interceded forty days and nights.",
"New tablets are placed in the ark. What God requires is to fear Him, walk in His ways, love and serve Him. He calls for circumcised hearts and loves the stranger.",
"Love and obey the Lord in a land watered by rain from heaven. A blessing and a curse are set before Israel, to be proclaimed on Mounts Gerizim and Ebal.",
"Israel is to destroy pagan worship sites and bring offerings only to the place God chooses. Meat may be eaten anywhere, but never the blood.",
"False prophets and anyone, even family, who entices others to serve other gods must be put to death, and a city that turns to idols is destroyed.",
"Clean and unclean foods, and the tithe, including the third-year tithe for the Levite, the stranger, the orphan and the widow.",
"Debts are released every seven years, and Israel is to give generously to the poor. Hebrew servants go free in the seventh year, and firstborn animals belong to the Lord.",
"The three pilgrim feasts of Passover, Weeks and Tabernacles, and the command to appoint judges who judge justly.",
"Idolaters are convicted on two or three witnesses, and hard cases go to the priests. A future king must not multiply horses, wives or gold and must write his own copy of the law.",
"Provision for priests and Levites, a ban on occult practices, and the promise that God will raise up a Prophet like Moses. A prophet is tested by whether his word comes true.",
"Cities of refuge for accidental killing, respect for boundary markers, the need for two or three witnesses, and punishment for false witnesses.",
"Rules for war: do not fear, certain men are sent home, offer peace before attacking distant cities, and spare fruit trees in a siege.",
"Laws on unsolved murder, captive wives, the rights of the firstborn, a rebellious son, and burying a hanged man the same day.",
"Laws about caring for a neighbor's lost property, various everyday rules, and sexual purity.",
"Who may enter the assembly of the Lord, cleanliness in the camp, and laws on escaped slaves, interest, and vows.",
"Laws on divorce, pledges, and prompt wages, with justice for the stranger, orphan and widow, and gleanings left for them.",
"Limits on punishment, not muzzling an ox while it threshes, a brother's duty to a childless widow, honest weights, and the charge to remember Amalek.",
"The declarations made when bringing firstfruits and the third-year tithe. Israel is the Lord's special people, and He is their God.",
"Israel is to write the law on stones and build an altar on Mount Ebal. The Levites pronounce twelve curses and the people answer Amen.",
"Blessings on Israel for obedience, followed by a long list of curses for disobedience: disease, drought, defeat, siege and exile.",
"The covenant is renewed in Moab with a warning against turning away. The secret things belong to the Lord, but what is revealed belongs to His people.",
"God promises to restore Israel when they return to Him and to circumcise their hearts. The word is near them. Moses sets life and death before them and urges them to choose life.",
"Moses commissions Joshua and tells him to be strong and of good courage. The law is to be read every seven years. God foretells Israel's rebellion, and the law is placed beside the ark.",
"The Song of Moses praises God the Rock, recounts Israel's unfaithfulness, and declares both judgment and mercy. Moses is told to go up Mount Nebo.",
"Moses blesses each of the tribes before his death and declares that the eternal God is their refuge.",
"Moses views the promised land from Mount Nebo and dies at 120; God buries him in Moab. Israel mourns thirty days, Joshua takes the lead, and no prophet like Moses has arisen since."
],
Joshua:[
"After Moses' death God commissions Joshua to lead Israel into the land, telling him to be strong and courageous and to meditate on the law day and night. The eastern tribes pledge their support.",
"Joshua sends two spies to Jericho. Rahab hides them, confesses that the Lord is God, and is promised safety if she hangs a scarlet cord in her window.",
"The priests carry the ark into the flooded Jordan, the water piles up upstream, and all Israel crosses on dry ground.",
"Twelve stones are taken from the riverbed and set up at Gilgal as a memorial for future generations of how God dried up the Jordan.",
"The men born in the wilderness are circumcised at Gilgal and Israel keeps the Passover. The manna stops, and the Commander of the Lord's army appears to Joshua.",
"Israel marches around Jericho once a day for six days and seven times on the seventh. At the trumpets and the shout the walls fall. Rahab's household is spared.",
"Achan secretly keeps some of Jericho's devoted things, and Israel is defeated at Ai. His sin is exposed and he is stoned in the Valley of Achor.",
"Israel takes Ai by ambush. Joshua builds an altar on Mount Ebal and reads all the words of the law, the blessings and the curses.",
"The Gibeonites pretend to be from a far country and trick Israel into a treaty, since the leaders did not ask counsel of the Lord. They become woodcutters and water carriers.",
"Five Amorite kings attack Gibeon. Joshua marches all night, God sends hailstones, and the sun stands still. Joshua then conquers the southern cities.",
"The northern kings led by Jabin of Hazor are defeated at the waters of Merom and Hazor is burned. Joshua takes the whole land, and the land rests from war.",
"A list of the kings Israel defeated: Sihon and Og east of the Jordan under Moses, and thirty-one kings west of it under Joshua.",
"Joshua is old and much land remains to be possessed. The inheritance east of the Jordan is described for Reuben, Gad and half of Manasseh; Levi receives no land.",
"The division of Canaan begins. Caleb, now eighty-five and still strong, asks for the hill country of Hebron that Moses promised him and receives it.",
"Judah's borders and cities. Caleb gives his daughter Achsah to Othniel for capturing Debir. Judah cannot drive the Jebusites out of Jerusalem.",
"The territory of Ephraim. They do not drive out the Canaanites of Gezer, who become forced laborers.",
"The territory of Manasseh, including the daughters of Zelophehad. The tribes of Joseph complain their land is too small and are told to clear the forested hills.",
"The tabernacle is set up at Shiloh. The land left for seven tribes is surveyed and divided by lot, and Benjamin's portion is described.",
"The portions of Simeon, Zebulun, Issachar, Asher, Naphtali and Dan. Joshua himself receives the city of Timnath Serah.",
"Six cities of refuge are appointed, three on each side of the Jordan, for anyone who kills a person unintentionally.",
"The Levites receive forty-eight cities among the tribes. The chapter ends by saying that not one of God's good promises to Israel failed.",
"The eastern tribes go home and build a large altar by the Jordan. The others prepare for war until they learn it is a witness, not a rival altar.",
"Joshua, old and near death, urges Israel's leaders to hold fast to the Lord and not mix with the nations that remain.",
"At Shechem Joshua reviews God's faithfulness and calls Israel to choose whom they will serve. The people renew the covenant. Joshua dies at 110, and Joseph's bones are buried."
],
Judges:[
"After Joshua's death the tribes continue the conquest, led by Judah. Many tribes fail to drive out the Canaanites and live among them.",
"The Angel of the Lord rebukes Israel at Bochim. A new generation forgets God, beginning a cycle of sin, oppression, crying out, and deliverance through judges.",
"God leaves nations to test Israel. Othniel delivers them from Mesopotamia, left-handed Ehud kills Eglon king of Moab, and Shamgar strikes the Philistines.",
"Deborah the prophetess sends Barak against Sisera and his nine hundred iron chariots. God routs the army, and Jael kills Sisera with a tent peg.",
"The song of Deborah and Barak celebrates the victory, praising those who volunteered and Jael, and rebuking the tribes that stayed home.",
"Midian oppresses Israel. The Angel of the Lord calls Gideon while he threshes wheat in hiding. Gideon tears down Baal's altar and asks for a sign with a fleece.",
"God reduces Gideon's army from thirty-two thousand to three hundred. With trumpets, pitchers and torches they throw the Midianite camp into panic.",
"Gideon pursues and kills the Midianite kings and refuses to be made king. He makes a gold ephod that becomes a snare, and the land has rest forty years.",
"Gideon's son Abimelech kills his seventy brothers and is made king at Shechem. Jotham tells a parable of the trees. Abimelech destroys Shechem and dies when a woman drops a millstone on him.",
"Tola and Jair judge Israel. The people serve many gods and are oppressed by the Ammonites and Philistines until they cry out and put away their idols.",
"Jephthah, driven out by his brothers, is called back to lead Gilead. He defeats the Ammonites, but his rash vow falls on his only daughter.",
"Ephraim quarrels with Jephthah, and forty-two thousand are killed at the Jordan fords, identified by how they say Shibboleth. Ibzan, Elon and Abdon judge after him.",
"The Angel of the Lord tells Manoah's barren wife she will bear a son, a Nazirite from the womb, who will begin to deliver Israel from the Philistines. Samson is born.",
"Samson wants a Philistine wife from Timnah. He kills a lion, poses a riddle at his wedding feast, and kills thirty men of Ashkelon to pay his wager.",
"Samson burns Philistine fields with three hundred foxes and torches and kills a thousand men with the jawbone of a donkey. God gives him water at Lehi.",
"Samson carries off the gates of Gaza. Delilah learns the secret of his hair, and he is captured and blinded. In death he pulls down the temple of Dagon on the Philistines.",
"Micah sets up a shrine with idols and hires a wandering Levite as his priest. There is no king in Israel and everyone does what is right in his own eyes.",
"The tribe of Dan, looking for land, takes Micah's idols and priest, conquers the quiet city of Laish, and sets up idol worship there.",
"A Levite's concubine is abused and killed by men of Gibeah in Benjamin. He cuts her body into twelve pieces and sends them throughout Israel.",
"Israel goes to war against Benjamin for refusing to hand over the guilty men. After two defeats Israel wins, and only six hundred Benjamite men survive.",
"Israel grieves over the near loss of a tribe and finds wives for the surviving Benjamites from Jabesh Gilead and Shiloh. There was no king in Israel."
],
Ruth:[
"A famine sends Elimelech's family from Bethlehem to Moab, where he and his two sons die. Naomi returns home, and her daughter-in-law Ruth refuses to leave her. They arrive at the barley harvest.",
"Ruth gleans in the field of Boaz, a relative of Elimelech. He has heard of her loyalty, shows her kindness, and tells her to stay with his workers.",
"Naomi sends Ruth to the threshing floor at night. Ruth asks Boaz to act as her kinsman redeemer, and he promises to settle the matter.",
"At the city gate a closer relative declines, and Boaz redeems the land and marries Ruth. Their son Obed becomes the grandfather of David."
],
"1 Samuel":[
"Hannah, barren and grieved, prays at Shiloh and vows to give her son to the Lord. Samuel is born, and she brings him to Eli to serve at the tabernacle.",
"Hannah praises God in song. Eli's sons abuse their priesthood while Samuel grows in favor, and a man of God announces judgment on Eli's house.",
"The Lord calls Samuel by name in the night and tells him of the coming judgment on Eli. Samuel becomes known as a prophet throughout Israel.",
"The Philistines defeat Israel and capture the ark. Hophni and Phinehas die, Eli falls and dies at the news, and his grandson is named Ichabod.",
"The Philistines put the ark in Dagon's temple and the idol falls before it. Tumors break out in each city where the ark is sent.",
"After seven months the Philistines send the ark back on a cart with gold offerings. Men of Beth Shemesh are struck down for looking into it.",
"The ark stays at Kirjath Jearim twenty years. Israel repents at Mizpah, the Lord thunders against the Philistines, and Samuel sets up the Ebenezer stone and judges Israel.",
"Samuel's sons are corrupt, and the elders ask for a king like the other nations. God says they have rejected Him as king, and Samuel warns what a king will take.",
"Saul, a tall young Benjamite, goes looking for his father's lost donkeys and meets Samuel, whom God has told to anoint him ruler.",
"Samuel anoints Saul. The signs come true, the Spirit comes on him, and he prophesies. At Mizpah he is chosen by lot and found hiding among the baggage.",
"Nahash the Ammonite threatens Jabesh Gilead. The Spirit comes on Saul, he rallies Israel and wins, and the kingdom is renewed at Gilgal.",
"Samuel gives his farewell, defends his integrity, reviews Israel's history, and calls the people to fear the Lord. God sends thunder and rain at harvest as a sign.",
"Facing the Philistines, Saul offers the sacrifice himself when Samuel is late. Samuel tells him his kingdom will not last and that God has sought a man after His own heart.",
"Jonathan and his armor-bearer attack a Philistine outpost and God sends a panic. Saul's rash oath forbidding food nearly costs Jonathan his life.",
"Saul is told to destroy Amalek but spares King Agag and the best livestock. Samuel says to obey is better than sacrifice, and the Lord rejects Saul as king.",
"God sends Samuel to Bethlehem to anoint David, Jesse's youngest son, because the Lord looks at the heart. David plays the harp to calm Saul.",
"The giant Goliath defies Israel for forty days. David, trusting in the name of the Lord, kills him with a sling and a stone.",
"Jonathan and David make a covenant of friendship. David's success makes Saul jealous, and he tries to kill him. David marries Saul's daughter Michal.",
"Saul orders David killed. Jonathan speaks up for him, Michal helps him escape through a window, and David flees to Samuel at Ramah.",
"David and Jonathan renew their covenant. Saul's rage at the feast confirms the danger, and an arrow signal tells David to flee. They part in tears.",
"David gets holy bread and Goliath's sword from Ahimelech the priest at Nob, then pretends to be mad before Achish king of Gath.",
"David gathers four hundred men at the cave of Adullam. Doeg the Edomite reports the priest's help, and Saul has eighty-five priests killed. Abiathar escapes to David.",
"David rescues Keilah from the Philistines and keeps moving to escape Saul. Jonathan strengthens his hand in God, and Saul nearly traps him before being called away.",
"In a cave at En Gedi David cuts off a corner of Saul's robe but will not harm the Lord's anointed. Saul weeps and admits David will be king.",
"Samuel dies. The wealthy fool Nabal insults David, but his wife Abigail brings food and wise words. Nabal dies, and David marries Abigail.",
"David and Abishai slip into Saul's camp and take his spear and water jug, sparing his life a second time.",
"David takes refuge with Achish of Gath and is given Ziklag. He raids desert tribes while letting Achish think he is attacking Judah.",
"The Philistines gather for war and God does not answer Saul. He consults a medium at En Dor, and Samuel tells him he and his sons will die the next day.",
"The Philistine commanders refuse to let David march with them, and Achish sends him back to Ziklag.",
"Amalekites burn Ziklag and carry off the families. David strengthens himself in the Lord, pursues, and recovers everything. He rules that all share the spoil alike.",
"The Philistines defeat Israel on Mount Gilboa. Saul's sons, including Jonathan, are killed and Saul falls on his sword. Men of Jabesh Gilead bury them."
],
"2 Samuel":[
"David learns that Saul and Jonathan are dead and executes the Amalekite who claims to have killed Saul. He sings a lament for them.",
"David is anointed king of Judah at Hebron. Abner makes Saul's son Ishbosheth king over the rest of Israel. In a battle at Gibeon, Abner kills Joab's brother Asahel.",
"David grows stronger as Saul's house weakens. Abner comes over to David's side, but Joab murders him in revenge. David mourns Abner publicly.",
"Two of Ishbosheth's captains murder him in his bed and bring his head to David, who has them executed.",
"All the tribes anoint David king over Israel. He captures Jerusalem from the Jebusites, makes it his capital, and defeats the Philistines twice.",
"David brings the ark toward Jerusalem. Uzzah touches it and dies, and the ark waits three months. David then brings it in with dancing, and Michal despises him.",
"David wants to build a house for God. Through Nathan, God promises instead to build David a house, a kingdom and a throne established forever. David responds in prayer.",
"David defeats the Philistines, Moab, Zobah, Syria and Edom. The Lord preserves him wherever he goes, and he rules with justice.",
"For Jonathan's sake David shows kindness to his lame son Mephibosheth, restoring Saul's land to him and giving him a place at the king's table.",
"The king of Ammon humiliates David's messengers. Joab and then David defeat the Ammonites and the Syrians they hired.",
"While his army is at war, David commits adultery with Bathsheba. When his cover-up fails he arranges for her husband Uriah to die in battle, then marries her.",
"Nathan confronts David with a story of a stolen lamb. David confesses and is forgiven, but the child dies. Solomon is born, and Rabbah is captured.",
"David's son Amnon violates his half-sister Tamar. Two years later her brother Absalom has Amnon killed and flees to Geshur.",
"Joab uses a wise woman from Tekoa to persuade David to bring Absalom home. After two more years Absalom is allowed to see the king.",
"Absalom wins the hearts of Israel and declares himself king at Hebron. David flees Jerusalem weeping and sends Hushai back to counter Ahithophel's advice.",
"Ziba brings supplies and accuses Mephibosheth, and Shimei curses David as he flees. Absalom enters Jerusalem and follows Ahithophel's counsel.",
"Hushai's advice is chosen over Ahithophel's, giving David time to cross the Jordan. Ahithophel goes home and hangs himself.",
"David's men defeat Absalom's army in the woods of Ephraim. Absalom is caught by his head in a tree and Joab kills him. David weeps for his son.",
"Joab rebukes David for his grief. David returns to Jerusalem, pardons Shimei, hears Mephibosheth, and honors Barzillai. Judah and Israel quarrel over the king.",
"Sheba leads a revolt. Joab murders Amasa, pursues Sheba to Abel, and a wise woman has Sheba's head thrown over the wall.",
"A three-year famine comes because Saul killed Gibeonites, and seven of his descendants are handed over. David's men kill four Philistine giants.",
"David's song of praise for deliverance from all his enemies and from Saul. The Lord is his rock, fortress and deliverer.",
"David's last words, followed by the names and deeds of his mighty men, including the three who broke through to bring him water from Bethlehem's well.",
"David orders a census and is convicted of sin. He chooses three days of plague, and seventy thousand die. He buys Araunah's threshing floor, builds an altar, and the plague stops."
],
"1 Kings":[
"David is old, and his son Adonijah tries to make himself king. Nathan and Bathsheba go to David, and Solomon is anointed king at Gihon.",
"David charges Solomon to keep God's law and then dies. Solomon secures his throne by dealing with Adonijah, Abiathar, Joab and Shimei.",
"At Gibeon God offers Solomon whatever he asks. He asks for an understanding heart and receives wisdom along with riches and honor. He judges between two mothers claiming one baby.",
"Solomon's officials and the peace and prosperity of his reign. His wisdom surpasses all others; he speaks three thousand proverbs and writes over a thousand songs.",
"Solomon arranges with Hiram king of Tyre for cedar and cypress and organizes the labor force to build the temple.",
"Solomon begins the temple 480 years after the Exodus and finishes it in seven years. Its size, cedar paneling, gold overlay and cherubim are described.",
"Solomon spends thirteen years on his own palace. Huram of Tyre casts the bronze pillars Jachin and Boaz, the great Sea, and the other temple furnishings.",
"The ark is brought into the temple and the glory of the Lord fills it. Solomon blesses the people, prays a long prayer of dedication, and holds a feast.",
"God appears to Solomon a second time with a promise and a warning. The chapter records his dealings with Hiram, his building projects, labor force and ships.",
"The queen of Sheba tests Solomon with hard questions and is overwhelmed by his wisdom and wealth. His gold, throne and horses are described.",
"Solomon's seven hundred wives and three hundred concubines turn his heart to other gods. God raises up enemies and promises ten tribes to Jeroboam. Solomon dies.",
"Rehoboam rejects the elders' advice and answers the people harshly. Ten tribes break away under Jeroboam, who sets up golden calves at Bethel and Dan.",
"A man of God from Judah prophesies against the altar at Bethel. On the way home he is deceived by an old prophet into disobeying God and is killed by a lion.",
"Ahijah foretells the death of Jeroboam's son and the end of his house. Judah under Rehoboam turns to idolatry, and Shishak of Egypt plunders the temple.",
"In Judah, Abijam reigns briefly, and Asa does what is right and removes idols. In Israel, Nadab is killed by Baasha, who wipes out Jeroboam's family.",
"Israel goes through Baasha, Elah, Zimri and Omri, who builds Samaria. Omri's son Ahab marries Jezebel and does more evil than all before him.",
"Elijah tells Ahab there will be no rain. He is fed by ravens at the Brook Cherith and then by a widow in Zarephath, whose flour and oil do not run out. He raises her son.",
"On Mount Carmel Elijah challenges 450 prophets of Baal. The Lord answers by fire, the people fall on their faces, and the rain returns.",
"Elijah flees from Jezebel to Horeb, where God speaks in a still small voice. He is told seven thousand have not bowed to Baal and calls Elisha to follow him.",
"Ben-Hadad of Syria besieges Samaria. God gives Ahab two victories, but Ahab spares Ben-Hadad and a prophet condemns him for it.",
"Ahab wants Naboth's vineyard, and Jezebel has Naboth falsely accused and stoned. Elijah pronounces judgment, and Ahab humbles himself.",
"Four hundred prophets promise Ahab victory, but Micaiah foretells his death. Ahab is killed by a random arrow at Ramoth Gilead. Jehoshaphat reigns well in Judah."
],
"2 Kings":[
"Injured King Ahaziah sends to consult a pagan god. Elijah calls down fire on two companies of soldiers sent to seize him, and the king dies as Elijah said.",
"Elijah is taken up to heaven in a whirlwind with a chariot of fire. Elisha receives a double portion of his spirit, parts the Jordan, and heals Jericho's water.",
"The kings of Israel, Judah and Edom march against Moab and run out of water. Elisha promises water and victory, and both come.",
"Elisha multiplies a widow's oil, promises the Shunammite woman a son and later raises him from death, purifies a poisoned stew, and feeds a hundred men.",
"Naaman, commander of Syria's army, is healed of leprosy when he dips seven times in the Jordan at Elisha's word. Elisha's servant Gehazi takes a reward by lying and becomes leprous.",
"Elisha makes an ax head float. His servant's eyes are opened to see horses and chariots of fire, and a blinded Syrian force is led into Samaria. Later Samaria suffers siege and famine.",
"Elisha foretells plenty by the next day. Four lepers find the Syrian camp abandoned, and the officer who doubted is trampled at the gate.",
"The Shunammite's land is restored. Elisha weeps as he tells Hazael he will be king of Syria. Jehoram and Ahaziah reign in Judah.",
"Jehu is anointed king of Israel and kills Joram of Israel and Ahaziah of Judah. Jezebel is thrown from a window and eaten by dogs, as Elijah foretold.",
"Jehu destroys Ahab's seventy sons and all the worshipers of Baal, but he does not turn from Jeroboam's golden calves.",
"Athaliah kills the royal heirs and rules Judah. The infant Joash is hidden in the temple for six years until the priest Jehoiada crowns him and Athaliah is executed.",
"Joash repairs the temple with money collected in a chest. Later he buys off Hazael of Syria with temple treasures and is killed by his servants.",
"Jehoahaz and Jehoash reign in Israel. The dying Elisha has the king shoot and strike arrows as a sign of victories over Syria. A dead man revives on touching Elisha's bones.",
"Amaziah of Judah defeats Edom but is beaten by Jehoash of Israel. Jeroboam II restores Israel's borders, as Jonah had prophesied.",
"Azariah and Jotham reign in Judah. Israel goes through a string of kings and assassinations, and Assyria begins carrying people away.",
"Ahaz of Judah follows pagan practices, calls on Assyria for help, and installs a copy of an altar from Damascus in the temple.",
"Under Hoshea, Samaria falls to Assyria after a three-year siege and Israel goes into exile for its idolatry. Foreigners are resettled and mix worship of the Lord with their gods.",
"Hezekiah trusts the Lord, removes the high places and breaks up the bronze serpent. Sennacherib of Assyria invades Judah, and his spokesman taunts Jerusalem.",
"Hezekiah spreads the Assyrian letter before the Lord and prays. Isaiah promises deliverance, and the angel of the Lord strikes down 185,000 Assyrians in one night.",
"Hezekiah is sick to death, prays, and is given fifteen more years, with the shadow moving backward as a sign. He shows his treasures to envoys from Babylon, and Isaiah foretells exile.",
"Manasseh reigns fifty-five years, rebuilding idol worship, sacrificing his son and shedding innocent blood. God announces judgment on Jerusalem. Amon follows him.",
"Josiah repairs the temple and the Book of the Law is found. He tears his clothes on hearing it, and Huldah the prophetess confirms the coming judgment.",
"Josiah renews the covenant, destroys idols and high places throughout the land, and keeps a great Passover. He is killed at Megiddo by Pharaoh Necho.",
"Nebuchadnezzar of Babylon subdues Judah. Jehoiachin surrenders and is exiled with ten thousand others, and Zedekiah is made king.",
"Jerusalem falls after a long siege. Zedekiah is blinded, the temple and city are burned, the walls are broken down, and Judah is taken to Babylon. Jehoiachin is later released from prison."
],
"1 Chronicles":[
"Genealogies from Adam through Noah's sons to Abraham, then the lines of Ishmael, Keturah and Esau, and the kings of Edom.",
"The twelve sons of Israel, then Judah's line through Perez and Hezron down to Jesse and David, with the family of Caleb.",
"David's sons born in Hebron and Jerusalem, the kings of Judah descended from Solomon, and the royal line after the exile through Zerubbabel.",
"More clans of Judah, including Jabez, who asked God to bless him and enlarge his territory. The families of Simeon follow.",
"The tribes east of the Jordan: Reuben, Gad and half of Manasseh. God gave them victory when they cried out in battle, but later they were exiled by Assyria for idolatry.",
"The line of Levi, including the high priests, the temple musicians Heman, Asaph and Ethan, and the cities given to the Levites.",
"The families of Issachar, Benjamin, Naphtali, Manasseh, Ephraim down to Joshua, and Asher.",
"A fuller genealogy of Benjamin leading to King Saul and his son Jonathan.",
"Those who resettled Jerusalem after the exile: priests, Levites, gatekeepers and singers. Saul's family line is repeated.",
"Saul and his sons die on Mount Gilboa. He died for his unfaithfulness to the Lord and for consulting a medium, and the kingdom turned to David.",
"All Israel anoints David king at Hebron. He captures Jerusalem, and his mighty men and their exploits are listed.",
"The warriors from every tribe who joined David at Ziklag and Hebron, including the men of Issachar who understood the times.",
"David brings the ark from Kirjath Jearim on a new cart. Uzza touches it and dies, and the ark is left at the house of Obed-Edom for three months.",
"Hiram of Tyre builds David a house, and his family grows. David inquires of God and defeats the Philistines twice.",
"David brings the ark to Jerusalem the right way, carried by Levites on poles, with appointed singers and musicians. Michal despises his dancing.",
"The ark is set in its tent and David gives a psalm of thanksgiving. Levites are appointed to minister before the ark regularly.",
"David wants to build God a house. Through Nathan, God promises to build David a house and establish his throne forever, and David prays in response.",
"David's victories over the Philistines, Moab, Zobah, Syria and Edom, and a list of his chief officials.",
"The Ammonite king shames David's messengers. Joab and Abishai defeat the Ammonites and their Syrian allies.",
"Joab captures Rabbah, and David's men kill several Philistine giants.",
"Satan moves David to number Israel. A plague follows, the angel stops at the threshing floor of Ornan, and David buys it and builds an altar that God answers with fire.",
"David names the threshing floor as the site for the temple, gathers materials, and charges Solomon, a man of rest, to build it.",
"David makes Solomon king and organizes the Levites by family and assigns their duties in the house of the Lord.",
"The priests descended from Aaron are divided by lot into twenty-four divisions, and the remaining Levites are listed.",
"The temple musicians from the families of Asaph, Heman and Jeduthun are organized into twenty-four divisions, 288 trained singers in all.",
"The divisions of gatekeepers, the keepers of the treasuries, and the officials and judges over Israel.",
"The twelve army divisions of twenty-four thousand, one serving each month, along with the tribal leaders, the stewards of the king's property, and his counselors.",
"David gathers the leaders, explains that God chose Solomon to build the temple, gives Solomon the plans, and tells him to be strong and do it.",
"David and the leaders give willingly for the temple, and David praises God in prayer. Solomon is anointed king, and David dies after reigning forty years."
],
"2 Chronicles":[
"Solomon worships at Gibeon and asks God for wisdom and knowledge to lead the people. God adds riches and honor.",
"Solomon prepares to build the temple and asks Hiram king of Tyre for a master craftsman and timber.",
"Solomon begins the temple on Mount Moriah at the threshing floor of Ornan. Its dimensions, the Most Holy Place, the cherubim, the veil and the two pillars are described.",
"The temple furnishings are made: the bronze altar, the Sea, the lavers, the gold lampstands and the tables.",
"The ark is brought into the Most Holy Place. As singers and 120 trumpeters praise the Lord together, a cloud of glory fills the house.",
"Solomon blesses the people and prays his prayer of dedication, asking God to hear and forgive when His people pray toward this place.",
"Fire comes down from heaven and consumes the sacrifices. God appears to Solomon and promises to hear and heal if His people humble themselves, pray and turn.",
"Solomon's building projects, his labor force, the order of worship he kept, and his ships sent to Ophir for gold.",
"The queen of Sheba visits and marvels at Solomon's wisdom. His great wealth is described, and he dies after reigning forty years.",
"Rehoboam follows the advice of the young men and answers harshly, and the ten northern tribes rebel.",
"God forbids Rehoboam to fight Israel. He fortifies Judah, and priests and Levites from the north move south to worship the Lord.",
"Rehoboam forsakes the law, and Shishak of Egypt invades. When the leaders humble themselves God spares them from destruction, but the temple treasures are taken.",
"Abijah of Judah faces Jeroboam's army, twice the size of his own. Judah cries out to the Lord and wins because they relied on Him.",
"Asa removes idols and commands Judah to seek the Lord. When Zerah the Ethiopian comes with a vast army, Asa prays and God gives victory.",
"The prophet Azariah encourages Asa. He leads Judah in renewing the covenant and removes his grandmother Maachah from being queen mother because of her idol.",
"Asa hires Syria against Israel and does not rely on God. Hanani the seer rebukes him, and Asa jails him. Diseased in his feet, he seeks only physicians.",
"Jehoshaphat walks in God's ways and sends officials and Levites through Judah to teach the law. The fear of the Lord falls on the surrounding kingdoms.",
"Jehoshaphat allies himself with Ahab. Micaiah alone foretells defeat, and Ahab is killed at Ramoth Gilead.",
"Jehu the seer rebukes Jehoshaphat for helping the wicked. Jehoshaphat appoints judges and tells them they judge for the Lord, not for man.",
"A great army from Moab, Ammon and Mount Seir invades. Jehoshaphat prays, Jahaziel declares the battle is God's, singers go out first, and the enemies destroy each other.",
"Jehoram kills his brothers and follows the ways of Ahab's house. Edom revolts, a letter from Elijah warns him, and he dies of a painful disease with no one's regret.",
"Ahaziah reigns one year and is killed by Jehu. His mother Athaliah seizes the throne, but the infant Joash is hidden in the house of God.",
"The priest Jehoiada crowns Joash at age seven. Athaliah is executed and the temple of Baal is torn down.",
"Joash repairs the temple while Jehoiada lives. After the priest's death he turns to idols and has Jehoiada's son Zechariah stoned. He is defeated by Syria and killed by his servants.",
"Amaziah defeats Edom but brings home their gods. He then challenges Israel, is defeated, and is later killed in a conspiracy.",
"Uzziah prospers as long as he seeks the Lord and builds a strong army. When he becomes proud and burns incense in the temple, he is struck with leprosy.",
"Jotham does what is right and becomes mighty because he orders his ways before the Lord.",
"Ahaz worships idols and burns his children in sacrifice. Judah is defeated by Syria and Israel, and the prophet Oded has the captives sent home. Ahaz shuts the temple doors.",
"In his first month as king, Hezekiah reopens the temple, has the Levites cleanse it, and restores the sacrifices and music.",
"Hezekiah invites all Israel and Judah to keep the Passover in the second month. Many come, and there is great joy in Jerusalem.",
"The people destroy idols throughout the land and bring tithes in heaps. Hezekiah organizes the priests and storerooms.",
"Sennacherib invades. Hezekiah encourages the people, he and Isaiah pray, and an angel destroys the Assyrian army. Hezekiah's illness, pride, and water tunnel are noted.",
"Manasseh does great evil, is taken in chains to Babylon, humbles himself, and is restored. His son Amon does evil and is assassinated.",
"Josiah seeks God at sixteen, purges idols at twenty, and repairs the temple. The Book of the Law is found, Huldah prophesies, and the king renews the covenant.",
"Josiah keeps a Passover unlike any since Samuel. He goes out against Pharaoh Necho and is killed at Megiddo, and Jeremiah laments him.",
"Judah's last four kings ignore God's messengers. The Chaldeans destroy Jerusalem and the temple and the people are exiled for seventy years, until Cyrus of Persia decrees their return."
],
Ezra:[
"Cyrus king of Persia proclaims that the Lord's house in Jerusalem should be rebuilt. Exiles set out, carrying the temple vessels Nebuchadnezzar had taken.",
"A list of the families who returned with Zerubbabel and Jeshua: 42,360 people, besides servants and singers.",
"The returned exiles rebuild the altar and keep the Feast of Tabernacles. When the temple foundation is laid, shouts of joy mix with the weeping of those who saw the first temple.",
"Adversaries offer to help build and are refused, then work to discourage the people. A letter to King Artaxerxes brings the work to a stop.",
"The prophets Haggai and Zechariah stir the people to resume building. Governor Tattenai questions them and writes to King Darius.",
"Darius finds Cyrus's decree and orders the work supported. The temple is finished in his sixth year, dedicated with joy, and the Passover is kept.",
"Ezra, a priest and scribe skilled in the Law of Moses, travels to Jerusalem with a letter from Artaxerxes. He had set his heart to seek, do and teach God's law.",
"The families who came with Ezra are listed. At the river Ahava they fast and pray for protection, and the temple treasures arrive safely.",
"Ezra learns that the people, even priests, have intermarried with the surrounding nations. He tears his garment and prays a confession of the nation's guilt.",
"The people weep and agree to put away their pagan wives. They assemble in the rain, the cases are examined, and the offenders are listed."
],
Nehemiah:[
"Nehemiah, cupbearer to the Persian king, hears that Jerusalem's wall is broken down and its gates burned. He weeps, fasts and prays, confessing Israel's sins.",
"King Artaxerxes grants Nehemiah leave and supplies. He inspects the walls by night and urges the people to rise and build, while Sanballat, Tobiah and Geshem mock.",
"A list of the people who rebuilt each section of the wall and each gate, working side by side.",
"Enemies mock and then plot to attack. Nehemiah prays and sets a guard, and the builders work with a tool in one hand and a weapon in the other.",
"The poor cry out against fellow Jews who charge interest and take their children as slaves. Nehemiah rebukes the nobles, has the debts restored, and refuses the governor's food allowance.",
"Sanballat and others try to lure Nehemiah away and frighten him with false reports. He refuses, and the wall is finished in fifty-two days.",
"Nehemiah appoints gatekeepers and puts his brother Hanani in charge of the city. He finds the register of the first exiles who returned.",
"Ezra reads the Law aloud from a wooden platform and the Levites explain it. The people weep, are told the joy of the Lord is their strength, and keep the Feast of Booths.",
"The people fast and confess. The Levites pray, recounting God's faithfulness from creation and Abraham through the wilderness, and Israel's repeated rebellion.",
"The leaders seal a written covenant. The people promise not to intermarry, to keep the Sabbath, and to support the house of God.",
"Lots are cast so that one in ten will live in Jerusalem. The residents of the city and the surrounding towns are listed.",
"The priests and Levites are listed. The wall is dedicated with two large thanksgiving choirs, and the joy of Jerusalem is heard far away.",
"Nehemiah returns from Persia and corrects abuses: Tobiah's room in the temple, unpaid Levites, trading on the Sabbath, and marriages to foreign wives."
],
Esther:[
"King Ahasuerus of Persia holds a lavish feast in Shushan. Queen Vashti refuses to appear at his command and is removed as queen.",
"Esther, a Jewish orphan raised by her cousin Mordecai, is chosen as the new queen and keeps her nationality secret. Mordecai uncovers a plot against the king.",
"Haman is promoted, and Mordecai will not bow to him. Enraged, Haman casts lots and gets a royal decree to destroy all the Jews on a set day.",
"Mordecai mourns in sackcloth and tells Esther she may have come to the kingdom for such a time. She calls a three-day fast and resolves to go to the king.",
"The king receives Esther, and she invites him and Haman to a banquet, then a second. Haman builds a tall gallows for Mordecai.",
"Unable to sleep, the king has the records read and learns Mordecai was never rewarded. Haman is made to lead Mordecai through the city in honor.",
"At the second banquet Esther reveals she is a Jew and names Haman as the enemy. He is hanged on the gallows he built for Mordecai.",
"Mordecai receives Haman's position. A new decree allows the Jews to defend themselves, and there is joy among the Jews in every province.",
"On the appointed day the Jews overcome their enemies, and Haman's ten sons are hanged. The feast of Purim is established to remember it.",
"A brief note on the greatness of Mordecai, second to the king, who sought the good of his people."
],
Job:[
"Job is blameless, upright and wealthy. Satan claims he serves God only for gain, and in one day Job loses his herds, servants and ten children. He worships and does not sin.",
"Satan strikes Job with painful boils. His wife tells him to curse God, but he refuses. Three friends, Eliphaz, Bildad and Zophar, come and sit with him in silence seven days.",
"Job breaks his silence and curses the day he was born, wishing he had died at birth and longing for the rest of the grave.",
"Eliphaz speaks first: the innocent do not perish, and those who sow trouble reap it. He tells of a night vision asking whether a mortal can be more righteous than God.",
"Eliphaz continues: trouble is common to man, so Job should seek God. The one God corrects is blessed, for He wounds and also heals.",
"Job answers that his grief is heavier than the sand of the sea. His friends are like streams that dry up when needed, and he asks them to show him where he is wrong.",
"Job describes life as hard service and nights of misery. He turns to God and asks why He watches him so closely and will not pardon him.",
"Bildad says God does not pervert justice and that Job's children died for their sin. He urges Job to learn from past generations and seek God.",
"Job agrees God is just, but asks how a man can be righteous before One so mighty. He wishes there were a mediator between them.",
"Job speaks to God in bitterness, asking why He contends with him and why the hands that made him now destroy him.",
"Zophar rebukes Job sharply, saying God exacts less than he deserves. No one can search out God's depths, so Job should put away sin.",
"Job answers with sarcasm that his friends think wisdom will die with them. Even the animals know God's hand, and God overturns counselors and kings.",
"Job calls his friends worthless physicians and wishes they would be silent. He will trust God even if it costs his life, and he wants to argue his case before Him.",
"Man's days are few and full of trouble. A cut tree may sprout again, but man lies down and does not rise. Job asks whether a man who dies will live again.",
"Eliphaz speaks a second time, accusing Job of empty talk that undermines reverence for God, and describes the torment of the wicked.",
