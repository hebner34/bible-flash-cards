places:[
{n:"Garden of Eden",w:"The beginning, in Genesis 2 and 3",t:"The garden God planted as the first home of Adam and Eve, with the tree of life and the tree of the knowledge of good and evil. Sin entered the world here, and the couple were sent out."},
{n:"Mountains of Ararat",w:"After the flood, in Noah's day",t:"The mountain region where Noah's ark came to rest as the flood waters went down. From here Noah's family and the animals went out to fill the earth again."},
{n:"Babel",w:"After the flood, before Abraham",t:"A city on the plain of Shinar where people built a tower to make a name for themselves. God confused their language there and scattered them over the earth."},
{n:"Ur of the Chaldeans",w:"About 2000 BC",t:"A city in Mesopotamia and the home of Abram's family. God called Abram to leave it for a land He would show him."},
{n:"Haran",w:"About 2000 to 1900 BC",t:"A city in northern Mesopotamia where Abram's family settled on the way to Canaan and where his father Terah died. Jacob later fled here, worked for Laban, and married Leah and Rachel."},
{n:"Canaan",w:"Promised about 2000 BC; conquered about 1400 BC",t:"The land God promised to Abraham and his descendants, described as flowing with milk and honey. Israel entered and conquered it under Joshua, and it became the land of Israel."},
{n:"Egypt",w:"Israel lived there about 1870 to 1446 BC; it appears throughout the Bible",t:"The great kingdom on the Nile. Joseph rose to power there, Israel grew into a nation and was enslaved there, and God brought them out through Moses. Joseph and Mary later fled there with the child Jesus."},
{n:"Goshen",w:"About 1870 to 1446 BC",t:"The fertile region of Egypt where Jacob's family settled under Joseph. Israel lived there for generations, and it was spared from several of the plagues."},
{n:"Sodom and Gomorrah",w:"About 2000 BC, in Abraham's day",t:"Wicked cities of the Jordan plain where Lot chose to live. God destroyed them with fire and brimstone after rescuing Lot, and they became a lasting picture of judgment."},
{n:"Hebron",w:"About 2000 BC, and David's reign from about 1010 BC",t:"A city in the hill country of Judah where Abraham lived and bought the cave of Machpelah as a family tomb. Caleb received it as his inheritance, and David reigned there seven years before taking Jerusalem."},
{n:"Beersheba",w:"About 2000 to 1850 BC, and later as Israel's southern border",t:"A well and town in the far south where Abraham and Isaac made covenants and God appeared to Isaac and Jacob. The phrase from Dan to Beersheba meant the whole land."},
{n:"Bethel",w:"About 1900 BC, and the divided kingdom after 931 BC",t:"The place where Jacob dreamed of a ladder reaching heaven and named it the house of God. Centuries later Jeroboam set up a golden calf there, and the prophets condemned it."},
{n:"Mount Moriah",w:"About 2000 BC, and Solomon's temple about 966 BC",t:"The mountain where Abraham was told to offer Isaac and God provided a ram. Solomon later built the temple on Mount Moriah in Jerusalem."},
{n:"Midian",w:"About 1486 to 1446 BC for Moses; about 1170 BC for Gideon",t:"The desert land where Moses fled from Pharaoh, married Zipporah, and kept sheep for forty years. The Midianites later oppressed Israel until God defeated them through Gideon."},
{n:"Mount Sinai (Horeb)",w:"About 1446 BC",t:"The mountain of God where Moses saw the burning bush and where God gave Israel the Ten Commandments and the law. Elijah later fled there and heard the still small voice."},
{n:"Red Sea",w:"About 1446 BC",t:"The sea God parted so Israel could cross on dry ground when Pharaoh's army pursued them. The waters returned and drowned the Egyptians, completing the deliverance from Egypt."},
{n:"Kadesh Barnea",w:"About 1445 BC",t:"An oasis on the edge of the promised land. From here the twelve spies were sent, and here Israel refused to enter, bringing forty years of wandering. Moses later struck the rock nearby."},
{n:"Mount Nebo",w:"About 1406 BC",t:"A mountain in Moab across from Jericho. From its top Moses viewed the promised land he was not allowed to enter, and he died there."},
{n:"Jordan River",w:"About 1406 BC for the crossing; about AD 27 for Jesus' baptism",t:"The river on Israel's eastern side. God stopped its waters so Israel could cross into Canaan, Naaman was healed in it, and John baptized Jesus there."},
{n:"Jericho",w:"About 1406 BC, and Jesus' ministry about AD 30",t:"The first city Israel took in Canaan, when its walls fell after seven days of marching. Rahab was spared there. Jesus later healed blind Bartimaeus and met Zacchaeus in Jericho."},
{n:"Gilgal",w:"About 1406 BC, through Saul's day about 1050 BC",t:"Israel's first camp after crossing the Jordan, where twelve memorial stones were set up and the people were circumcised. Saul was later confirmed as king there and also rejected there."},
{n:"Shiloh",w:"About 1400 to 1050 BC",t:"The town where the tabernacle stood through the time of the judges. Hannah prayed there and Samuel grew up there. It was abandoned after the ark was captured."},
{n:"Shechem",w:"About 2000 BC through 931 BC",t:"A city between Mount Ebal and Mount Gerizim where Abram first built an altar in Canaan. Joshua renewed the covenant there, and the kingdom split there under Rehoboam. Jacob's well was nearby."},
{n:"Bethlehem",w:"About 1100 BC for Ruth, 1040 BC for David, and about 5 BC for Jesus' birth",t:"A small town in Judah, home of Ruth and Boaz and birthplace of David. Micah foretold that a ruler would come from it, and Jesus was born there."},
{n:"Jerusalem",w:"Israel's capital from about 1003 BC; destroyed 586 BC and again in AD 70",t:"The city David captured and made his capital, where Solomon built the temple. It was destroyed by Babylon and rebuilt after the exile. Jesus was crucified and rose there, and the church began there."},
{n:"Mount Zion",w:"From about 1003 BC",t:"The stronghold David took from the Jebusites, which became the City of David. The name came to stand for Jerusalem, the temple mount, and the dwelling place of God with His people."},
{n:"Mount Carmel",w:"About 860 BC",t:"A mountain ridge on the coast where Elijah challenged the prophets of Baal. God answered by fire, and the people confessed that the Lord is God."},
{n:"Samaria",w:"Capital from about 880 BC; fell 722 BC; a region in Jesus' day",t:"The capital of the northern kingdom of Israel, built by Omri. It fell to Assyria, and the mixed people who settled the region became the Samaritans. Jesus spoke with a Samaritan woman there."},
{n:"Dan",w:"From the time of the judges; calf worship from 931 BC",t:"The northernmost city of Israel, taken by the tribe of Dan. Jeroboam placed one of his two golden calves there."},
{n:"Philistia",w:"About 1200 to 700 BC",t:"The coastal land of the Philistines with its five cities, including Gaza, Gath and Ashdod. They were Israel's chief enemy in the days of Samson, Samuel, Saul and David."},
{n:"Moab",w:"About 1400 to 600 BC",t:"The land east of the Dead Sea, descended from Lot. Israel camped on its plains before entering Canaan, Balaam was hired there to curse Israel, and Ruth came from Moab."},
{n:"Edom",w:"About 1900 to 550 BC",t:"The rugged land south of the Dead Sea settled by Esau's descendants. Edom refused Israel passage and later rejoiced at Jerusalem's fall, and the prophets, especially Obadiah, spoke against it."},
{n:"Damascus",w:"Prominent about 950 to 732 BC; Paul's conversion about AD 34",t:"The capital of Syria, a frequent enemy of Israel in the days of the kings. Naaman came from there. Saul was on the road to Damascus when the risen Jesus stopped him."},
{n:"Tyre",w:"About 1000 to 570 BC, and New Testament times",t:"A wealthy Phoenician seaport. Its king Hiram supplied cedar and craftsmen for David and Solomon. The prophets condemned its pride, and Jesus visited the region."},
{n:"Assyria",w:"About 900 to 612 BC",t:"A powerful and cruel empire to the northeast. God used it to judge the northern kingdom, which it carried into exile. It threatened Jerusalem under Hezekiah, but God struck its army."},
{n:"Nineveh",w:"About 760 BC for Jonah; destroyed 612 BC",t:"The great capital of Assyria. It repented at the preaching of Jonah and was spared. Later Nahum foretold its destruction, and it fell."},
{n:"Babylon",w:"Empire about 605 to 539 BC",t:"The capital of the empire that destroyed Jerusalem and the temple and held Judah captive for seventy years. Daniel and Ezekiel served God there. In Revelation it stands for the world system opposed to God."},
{n:"Persia and Shushan",w:"About 539 to 331 BC",t:"The empire that conquered Babylon. Its king Cyrus let the Jews return home. Shushan was a royal city where Esther became queen and Nehemiah served as cupbearer."},
{n:"Nazareth",w:"About 4 BC to AD 27",t:"A small, little-regarded town in Galilee where Mary and Joseph lived and where Jesus grew up. He was later rejected in its synagogue."},
{n:"Galilee",w:"About AD 27 to 30",t:"The northern region of Israel where Jesus spent most of His ministry, teaching, healing, and calling His disciples, many of them fishermen."},
{n:"Sea of Galilee",w:"About AD 27 to 30",t:"A freshwater lake in the north, also called the Sea of Tiberias or Lake of Gennesaret. Jesus called fishermen from its shore, calmed its storm, and walked on its water."},
{n:"Capernaum",w:"About AD 27 to 30",t:"A fishing town on the Sea of Galilee that became Jesus' home base. He taught in its synagogue and did many miracles there, yet He rebuked it for its unbelief."},
{n:"Bethany",w:"About AD 30",t:"A village near Jerusalem on the Mount of Olives, home of Mary, Martha and Lazarus. Jesus raised Lazarus there and was anointed there before His death."},
{n:"Mount of Olives",w:"About AD 30; also in Zechariah's prophecy",t:"The ridge east of Jerusalem. Jesus taught about the end times there, prayed in the garden at its foot, and ascended to heaven from it."},
{n:"Gethsemane",w:"About AD 30",t:"A garden at the foot of the Mount of Olives where Jesus prayed in agony the night before the cross and was betrayed by Judas and arrested."},
{n:"Golgotha (Calvary)",w:"About AD 30",t:"The place of a skull, outside the walls of Jerusalem, where Jesus was crucified between two criminals."},
{n:"Emmaus",w:"About AD 30",t:"A village about seven miles from Jerusalem. On the road there the risen Jesus walked with two disciples and explained the Scriptures, and they knew Him when He broke bread."},
{n:"Caesarea",w:"About AD 40 to 60",t:"A Roman port city on the coast of Judea. Peter preached to Cornelius there, opening the door to the Gentiles, and Paul was held there two years before sailing for Rome."},
{n:"Antioch of Syria",w:"About AD 40 to 50",t:"A large city north of Israel where a strong church of Jews and Gentiles grew. Believers were first called Christians there, and it sent out Paul and Barnabas on their missionary journeys."},
{n:"Tarsus",w:"First century AD",t:"A leading city in Cilicia and the birthplace of Paul, who was a Roman citizen from there. He returned to it for a time after his conversion."},
{n:"Philippi",w:"About AD 50",t:"A Roman colony in Macedonia and the first place Paul preached in Europe. Lydia believed there, and Paul and Silas sang in its jail before the jailer was saved."},
{n:"Thessalonica",w:"About AD 50",t:"A major city in Macedonia where Paul preached for a few weeks before a mob drove him out. The young church there received two of his earliest letters."},
{n:"Athens",w:"About AD 50",t:"The Greek center of philosophy and idols. Paul preached on Mars Hill about the unknown God who made the world and raised Jesus from the dead."},
{n:"Corinth",w:"About AD 50 to 57",t:"A wealthy and immoral Greek port city where Paul spent eighteen months and worked with Aquila and Priscilla. He wrote two letters to its troubled church."},
{n:"Ephesus",w:"About AD 52 to 95",t:"A great city in Asia Minor, home of the temple of Diana. Paul taught there about three years, Timothy later led its church, and it is the first church addressed in Revelation."},
{n:"Rome",w:"New Testament era; Paul arrived about AD 60",t:"The capital of the empire that ruled Israel in the time of Jesus. Paul wrote to its church, was brought there as a prisoner, and preached there under guard."},
{n:"Malta",w:"About AD 60",t:"The island where Paul and all aboard came ashore after their shipwreck. He survived a viper's bite and healed many during the three months they stayed."},
{n:"Patmos",w:"About AD 95",t:"A small island in the Aegean Sea where the apostle John was exiled for the word of God. There he received the visions recorded in Revelation."}

lsSet(PEND_KEY,pending);

var artifact=null, tts=null;
var view=lsGet(VIEW_KEY,{cat:"all",book:"all",shuffled:true});
var state={cat:view.cat||"all",book:view.book||"all",shuffled:view.shuffled!==false,deck:[],pos:0,flipped:false,note:""};

/* reading verse references so duplicates can be spotted */
function nrm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,"")}
var BOOKN=BOOKS.map(function(b){return b==="Psalms"?"psalm":nrm(b)});
var ALIAS={psalms:"psalm",ps:"psalm",psa:"psalm",jn:"john",jhn:"john",mt:"matthew",matt:"matthew",mk:"mark",mrk:"mark",lk:"luke",ex:"exodus",exod:"exodus",dt:"deuteronomy",deut:"deuteronomy",pr:"proverbs",prov:"proverbs",is:"isaiah",isa:"isaiah",php:"philippians",phil:"philippians",jas:"james",revelations:"revelation",songofsongs:"songofsolomon","1kgs":"1kings","2kgs":"2kings","1jn":"1john","2jn":"2john","3jn":"3john"};
function bookKey(s){
  var n=nrm(s);if(ALIAS[n])n=ALIAS[n];
  if(BOOKN.indexOf(n)>=0)return n;
  if(n.length>=3){var hits=BOOKN.filter(function(b){return b.indexOf(n)===0});if(hits.length===1)return hits[0]}
  return n;
}
function parseRef(r){
  var m=/^\s*(.+?)\s*(\d+)\s*[:.]\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*$/.exec(String(r));
  if(!m)return {b:nrm(r),c:0,v1:0,v2:0,loose:true};
  var v1=+m[3],v2=m[4]?+m[4]:v1;
  return {b:bookKey(m[1]),c:+m[2],v1:v1,v2:Math.max(v1,v2)};
}
function vkey(r){
  var p=parseRef(r),i=BOOKN.indexOf(p.b);
  return (i<0?99:i)*1e6+p.c*1e3+p.v1;
}
function allVerses(){
  var out=(window.CARDS.verses||[]).map(function(v){return {r:v.r,t:v.t,ver:"KJV",mine:false}});
  user.verses.concat(pending).forEach(function(v){out.push({r:v.ref,t:v.text,ver:v.ver||"",id:v.id,mine:true})});
  out.forEach(function(v,i){v.k=vkey(v.r);v.i=i});
  out.sort(function(a,b){return a.k-b.k||a.i-b.i});
  return out;
}
/* same = identical reference; near = same chapter with overlapping verses */
function findMatches(ref,skipId){
  var p=parseRef(ref),same=[],near=[];
  allVerses().forEach(function(v){
    if(skipId&&v.id===skipId)return;
    var q=parseRef(v.r);
    if(p.b!==q.b||p.c!==q.c)return;
    if(p.loose||q.loose){if(p.loose&&q.loose)same.push(v);return}
    if(p.v1===q.v1&&p.v2===q.v2)same.push(v);
    else if(p.v1<=q.v2&&q.v1<=p.v2)near.push(v);
  });
  return {same:same,near:near};
}

function allCards(){
  var out=[];
  var ch=window.CARDS.chapters;
  BOOKS.forEach(function(b){
    (ch[b]||[]).forEach(function(s,i){out.push({type:"chapter",book:b,front:b+" "+(i+1),sub:"What happens in this chapter?",back:s})});
  });
  allVerses().forEach(function(v){out.push({type:"verse",id:v.id,front:v.r,sub:v.ver,back:v.t})});
  window.CARDS.people.forEach(function(p){out.push({type:"person",front:p.n,sub:"How did God use this person?",back:p.t})});
  (window.CARDS.places||[]).forEach(function(p){out.push({type:"place",front:p.n,sub:"Why does this place matter?",back:p.t+(p.w?"\n\nWhen: "+p.w:"")})});
  return out;
}
var TYPE_OF={chapters:"chapter",verses:"verse",people:"person",places:"place"};
function filtered(){
  return allCards().filter(function(c){
    if(state.cat!=="all"&&c.type!==TYPE_OF[state.cat])return false;
    if(state.cat==="chapters"&&state.book!=="all"&&c.book!==state.book)return false;
    return true;
  });
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function deal(){
  var d=filtered();
  state.deck=state.shuffled?shuffle(d):d;
  state.pos=0;state.flipped=false;
  lsSet(VIEW_KEY,{cat:state.cat,book:state.book,shuffled:state.shuffled});
}

var app=document.getElementById("app");
app.innerHTML=
'<div class="top"><h1>Bible Flash Cards</h1><div class="count" id="count"></div></div>'+
'<div class="chips" id="chips" role="group" aria-label="Card type"></div>'+
'<div class="row"><select id="book" aria-label="Book"></select>'+
'<button class="btn" id="shuf" type="button">Shuffle</button>'+
'<button class="btn" id="order" type="button">In order</button></div>'+
'<div class="stage" id="stage"></div>'+
'<div class="nav"><button class="btn" id="prev" type="button">Back</button>'+
'<button class="btn primary" id="flip" type="button">Flip</button>'+
'<button class="btn" id="next" type="button">Next</button></div>'+
'<div class="tools"><button class="btn" id="speak" type="button" hidden>Read aloud</button>'+
'<button class="btn" id="del" type="button" hidden>Remove this verse</button>'+
'<button class="btn" id="list" type="button">Verse list</button>'+
'<button class="btn" id="add" type="button">Add a memory verse</button></div>'+
'<p class="note" id="note" role="status"></p>'+
'<div class="overlay" id="overlay" hidden><form class="sheet" id="vform">'+
'<h2>Add a memory verse</h2>'+
'<label for="vref">Reference<input id="vref" required placeholder="John 3:16" autocomplete="off"></label>'+
'<p class="dup" id="vdup" role="alert" hidden></p>'+
'<label for="vver">Version<input id="vver" value="KJV" autocomplete="off"></label>'+
'<label for="vtext">Verse text<textarea id="vtext" required placeholder="Type or paste the verse here"></textarea></label>'+
'<div class="row"><button class="btn" id="vcancel" type="button">Cancel</button>'+
'<button class="btn primary" id="vsave" type="submit">Save verse</button></div></form></div>'+
'<div class="overlay" id="lov" hidden><div class="sheet tall">'+
'<h2>Verse list</h2>'+
'<input id="lq" type="search" placeholder="Search by reference or words" aria-label="Search verses" autocomplete="off">'+
'<p class="note" id="lcount"></p>'+
'<div class="vlist" id="vlist"></div>'+
'<div class="row"><button class="btn primary" id="ldone" type="button">Done</button></div></div></div>';

function $(id){return document.getElementById(id)}

function renderChips(){
  var all=allCards(), n={all:all.length,chapters:0,verses:0,people:0,places:0};
  all.forEach(function(c){if(c.type==="chapter")n.chapters++;else if(c.type==="verse")n.verses++;else if(c.type==="place")n.places++;else n.people++});
  var defs=[["all","All"],["chapters","Chapters"],["verses","Verses"],["people","Characters"],["places","Places"]];
  $("chips").innerHTML=defs.map(function(d){
    return '<button class="chip" type="button" data-cat="'+d[0]+'" aria-pressed="'+(state.cat===d[0])+'"><span class="dot"></span>'+d[1]+' <small>'+n[d[0]]+'</small></button>';
  }).join("");
  var sel=$("book");
  var have=BOOKS.filter(function(b){return (window.CARDS.chapters[b]||[]).length});
  sel.innerHTML='<option value="all">All books</option>'+have.map(function(b){return '<option value="'+esc(b)+'">'+esc(b)+'</option>'}).join("");
  if(have.indexOf(state.book)<0)state.book="all";
  sel.value=state.book;
  sel.hidden=state.cat!=="chapters";
  $("shuf").setAttribute("aria-pressed",String(state.shuffled));
  $("order").setAttribute("aria-pressed",String(!state.shuffled));
}

function renderCard(){
  var c=state.deck[state.pos], stage=$("stage");
  var has=!!c;
  $("prev").disabled=!has||state.pos===0;
  $("flip").disabled=!has;$("next").disabled=!has;
  $("count").textContent=has?(state.pos+1)+" of "+state.deck.length:"0 cards";
  $("next").textContent=has&&state.pos===state.deck.length-1?"Start over":"Next";
  $("del").hidden=!(has&&c.type==="verse"&&c.id);
  $("speak").hidden=!has||!canSpeak();
  $("note").textContent=state.note;
  if(!has){
    stage.innerHTML='<div class="empty"><div>No cards here yet.</div></div>';
    return;
  }
  stage.innerHTML='<button class="card'+(state.flipped?" flipped":"")+'" id="card" type="button" style="--cat:'+CATVAR[c.type]+'" aria-label="Flash card. Tap to flip.">'+
    '<span class="face front"><span class="eyebrow">'+LABEL[c.type]+'</span><span class="body"><span class="title">'+esc(c.front)+'</span>'+(c.sub?'<span class="sub">'+esc(c.sub)+'</span>':'')+'</span><span class="hint">Tap to flip</span></span>'+
    '<span class="face back"><span class="eyebrow">'+esc(c.front)+'</span><span class="body">'+esc(c.back)+'</span></span></button>';
}
function render(){renderChips();renderCard()}

function flip(){if(!state.deck.length)return;state.flipped=!state.flipped;stopSpeak();var el=$("card");if(el)el.classList.toggle("flipped",state.flipped)}
function go(d){
  if(!state.deck.length)return;
  stopSpeak();state.note="";
  var p=state.pos+d;
  if(p<0)return;
  if(p>=state.deck.length){deal();state.note=state.shuffled?"Reshuffled. Back to the first card.":"Back to the first card.";renderCard();return}
  state.pos=p;state.flipped=false;renderCard();
}

/* reading aloud */
function canSpeak(){return !!tts||("speechSynthesis" in window)}
function stopSpeak(){try{if(tts)tts.stop();else if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function speak(){
  var c=state.deck[state.pos];if(!c)return;
  var text=state.flipped?c.back:c.front;
  if(tts){tts.speak(text).catch(function(){})}
  else{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}catch(e){}}
}

/* saving the user's verses into the page itself */
function buildDoc(data){
  var css=$("css").textContent, cards=$("cards").textContent, js=$("appjs").textContent;
  var json=JSON.stringify(data).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Bible Flash Cards</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">\n'+
    '<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n'+
    '<script id="cards">'+cards+'<\/script>\n'+
    '<script id="userdata" type="application/json">'+json+'<\/script>\n'+
    '<script id="appjs">'+js+'<\/script>\n</body>\n</html>\n';
}
function persist(okMsg){
  lsSet(PEND_KEY,pending);
  deal();
  if(!artifact){state.note=okMsg+" Saved on this phone.";render();return}
  state.note="Saving…";render();
  artifact.publish(buildDoc({verses:user.verses.concat(pending)})).then(function(){lsSet(PEND_KEY,[])},function(){
    state.note=okMsg+" Could not save to the page, so the change is kept on this device only.";render();
  });
}
function removeVerse(id){
  pending=pending.filter(function(v){return v.id!==id});
  user.verses=user.verses.filter(function(v){return v.id!==id});
}

$("chips").addEventListener("click",function(e){
  var b=e.target.closest(".chip");if(!b)return;
  state.cat=b.getAttribute("data-cat");state.note="";deal();render();
});
$("book").addEventListener("change",function(){state.book=this.value;state.note="";deal();render()});
$("shuf").addEventListener("click",function(){state.shuffled=true;state.note="Shuffled.";deal();render()});
$("order").addEventListener("click",function(){state.shuffled=false;state.note="In order.";deal();render()});
$("prev").addEventListener("click",function(){go(-1)});
$("next").addEventListener("click",function(){go(1)});
$("flip").addEventListener("click",flip);
$("speak").addEventListener("click",speak);
$("stage").addEventListener("click",function(e){if(e.target.closest("#card"))flip()});

var tx=null,ty=null;
$("stage").addEventListener("touchstart",function(e){tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",function(e){
  if(tx===null)return;
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
},{passive:true});
document.addEventListener("keydown",function(e){
  if(!$("overlay").hidden){if(e.key==="Escape")closeForm();return}
  if(!$("lov").hidden){if(e.key==="Escape")closeList();return}
  if(e.target.closest("select,input,textarea"))return;
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "&&!e.target.closest("button")){e.preventDefault();flip()}
});

/* add form, with a duplicate check */
function label(v){return v.r+(v.mine?" (added by you)":" (built in)")}
function checkDup(){
  var ref=$("vref").value.trim(), box=$("vdup");
  if(!ref){box.hidden=true;box.textContent="";return false}
  var m=findMatches(ref);
  if(m.same.length){
    box.className="dup stop";box.hidden=false;
    box.textContent="That verse is already in your deck: "+label(m.same[0])+". It was not added.";
    return true;
  }
  if(m.near.length){
    box.className="dup";box.hidden=false;
    box.textContent="Heads up, your deck already has: "+m.near.map(label).join(", ")+". You can still save this one.";
    return false;
  }
  box.hidden=true;box.textContent="";return false;
}
function closeForm(){$("overlay").hidden=true}
$("add").addEventListener("click",function(){$("overlay").hidden=false;checkDup();$("vref").focus()});
$("vref").addEventListener("input",checkDup);
$("vcancel").addEventListener("click",closeForm);
$("overlay").addEventListener("click",function(e){if(e.target===this)closeForm()});
$("vform").addEventListener("submit",function(e){
  e.preventDefault();
  var ref=$("vref").value.trim(), text=$("vtext").value.trim(), ver=$("vver").value.trim();
  if(!ref||!text)return;
  if(checkDup()){$("vref").focus();return}
  pending.push({id:"v"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),ref:ref,ver:ver,text:text});
  $("vref").value="";$("vtext").value="";$("vdup").hidden=true;closeForm();
  state.cat="verses";
  persist("Added "+ref+".");
});

var delArmed=null;
$("del").addEventListener("click",function(){
  var c=state.deck[state.pos];if(!c||c.type!=="verse"||!c.id)return;
  if(delArmed!==c.id){delArmed=c.id;state.note="Tap Remove again to delete "+c.front+".";$("note").textContent=state.note;return}
  delArmed=null;removeVerse(c.id);persist("Removed "+c.front+".");
});

/* verse list: everything in Bible order, with search and delete */
var listDirty=false, listArmed=null;
function renderList(){
  var q=$("lq").value.trim().toLowerCase(), all=allVerses(), counts={};
  all.forEach(function(v){var p=parseRef(v.r),k=p.b+"|"+p.c+"|"+p.v1+"|"+p.v2;v.dk=k;counts[k]=(counts[k]||0)+1});
  var rows=all.filter(function(v){return !q||(v.r+" "+v.t).toLowerCase().indexOf(q)>=0||nrm(v.r).indexOf(nrm(q))>=0&&nrm(q)});
  var mine=all.filter(function(v){return v.mine}).length;
  var dups=all.filter(function(v){return v.mine&&counts[v.dk]>1}).length;
  $("lcount").textContent=all.length+" verse cards, "+mine+" added by you"+(dups?", "+dups+" marked Duplicate":"")+(q?". Showing "+rows.length+".":".");
  $("vlist").innerHTML=rows.length?rows.map(function(v){
    var dup=v.mine&&counts[v.dk]>1;
    return '<div class="vrow'+(dup?" isdup":"")+'"><div class="vmain"><div class="vref">'+esc(v.r)+' <span class="tag">'+esc(v.ver||"")+(v.mine?" · yours":"")+'</span>'+(dup?' <span class="tag warn">Duplicate</span>':'')+'</div>'+
      '<div class="vtxt">'+esc(v.t)+'</div></div>'+
      (v.mine?'<button class="btn sm" type="button" data-del="'+esc(v.id)+'">'+(listArmed===v.id?"Confirm":"Delete")+'</button>':'')+'</div>';
  }).join(""):'<p class="note">No verses match that search.</p>';
}
function closeList(){
  $("lov").hidden=true;listArmed=null;
  if(listDirty){listDirty=false;persist("Verse list updated.")}
}
$("list").addEventListener("click",function(){$("lq").value="";listArmed=null;$("lov").hidden=false;renderList()});
$("lq").addEventListener("input",renderList);
$("ldone").addEventListener("click",closeList);
$("lov").addEventListener("click",function(e){if(e.target===this)closeList()});
$("vlist").addEventListener("click",function(e){
  var b=e.target.closest("[data-del]");if(!b)return;
  var id=b.getAttribute("data-del");
  if(listArmed!==id){listArmed=id;renderList();return}
  listArmed=null;removeVerse(id);listDirty=true;renderList();
});

deal();render();

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
